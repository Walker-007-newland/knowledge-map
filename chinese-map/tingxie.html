<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生字词听写</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tingxie.css">
</head>
<body class="dict tingxie on-home">
<header class="topbar">
  <button class="btn" id="btnBack">← 返回</button>
  <div class="brand">
    <h1 id="title">生字词听写</h1>
    <span class="sub" id="subtitle">课本生字词 · 按单元、按课选词听写</span>
  </div>
</header>

<main>
  <!-- 选单元、选课 -->
  <section class="view" id="vHome">
    <div class="grades" id="grades" role="tablist" aria-label="年级"></div>
    <div class="book-bar">
      <div class="seg" id="terms"><button data-t="上">上册</button><button data-t="下">下册</button></div>
      <span class="book-name" id="bookName"></span>
      <span class="badge-check" id="bookUnchecked" hidden title="还没对照纸质课本抽查确认">待核对</span>
    </div>
    <div class="card units-card">
      <div class="units-head">
        <label class="chk"><input type="checkbox" id="chkAll"> 全选</label>
        <span class="units-tip">点单元名展开看各课</span>
      </div>
      <div id="units"></div>
      <p class="empty" id="unitsLoading" hidden>正在载入词表…</p>
    </div>
    <p class="hint src" id="bookSrc"></p>
    <div class="bottom-bar">
      <span class="sel-info" id="selInfo">先勾选要听写的课</span>
      <button class="btn big" id="btnWrong">错词本</button>
      <button class="btn big primary" id="btnDict" disabled>听写</button>
    </div>
  </section>

  <!-- 错词本 -->
  <section class="view" id="vWrong" hidden>
    <div class="card">
      <h2>错词本</h2>
      <p class="hint">听写写错的词会进错词本，再听写写对一次就移出。</p>
      <div id="wrongRows"></div>
      <p class="empty" id="wrongEmpty" hidden>没有错词，真棒！</p>
    </div>
    <div class="row-actions sticky">
      <button class="btn primary big" id="btnWrongDict">听写全部错词</button>
    </div>
  </section>

  <!-- 听写设置 / 听写中 / 批改 / 结果：js/tingxie-run.js 生成 -->
  <div id="dictRun"></div>
</main>

<div class="toast" id="toast" hidden></div>

<script src="data/tingxie/books.js"></script>
<script src="js/tingxie-run.js"></script>
<script>TingxieRun.mount(document.getElementById('dictRun'));</script>
<script src="js/tingxie.js"></script>
</body>
</html>
