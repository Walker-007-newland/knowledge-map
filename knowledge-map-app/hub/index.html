<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识图谱</title>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --text: #1f2328; --muted: #6b6f76; --line: #ddd7cb;
    --accent: #2f6fde; --shadow: 0 6px 24px rgba(30, 30, 20, .10);
    --font: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181b; --surface: #212226; --text: #e8e6e1; --muted: #9a9ca3; --line: #36373d;
      --accent: #6b9bf0; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* .btn、.synctag 等设了 display 的元素，hidden 也要真的藏起来 */
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px 32px; }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 2px; }
  .muted { margin: 0; color: var(--muted); font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
    width: 100%; max-width: 980px; margin-top: 28px; }
  .card { display: flex; align-items: center; gap: 16px; padding: 20px 22px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none;
    box-shadow: var(--shadow); -webkit-tap-highlight-color: transparent; transition: transform .12s, border-color .12s; }
  .card:active { transform: scale(.97); }
  .card:hover { border-color: var(--accent); }
  .ico { flex: none; width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-size: 30px; }
  .card h2 { margin: 0 0 4px; font-size: 22px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .group { grid-column: 1 / -1; margin: 10px 0 -4px; color: var(--muted); font-size: 14px; letter-spacing: 1px; }
  footer { margin-top: auto; padding-top: 28px; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 12px; }
  footer button { font: inherit; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  footer button:active, footer .data:active { background: var(--line); }
  footer .data { color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .pet { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 980px; margin-top: 24px; padding: 16px 22px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent; transition: transform .12s, border-color .12s; }
  .pet:active { transform: scale(.98); }
  .pet:hover { border-color: var(--accent); }
  .pet .ico { background: #fbefdc; }
  .pet h2 { margin: 0 0 4px; font-size: 20px; }
  .pet p { margin: 0; color: var(--muted); font-size: 14px; }
  .pet .meter { width: 120px; height: 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .pet .meter i { display: block; height: 100%; border-radius: 999px; }
  /* #1 设备同步：右上角状态标签（只在已加入同步组时显示） */
  .synctag { position: fixed; top: 12px; right: 12px; z-index: 5; padding: 6px 12px; border-radius: 999px; font-size: 14px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted); box-shadow: var(--shadow); }
  .synctag.ok { color: #2f8a4c; } .synctag.error, .synctag.offline { color: #c23f2e; } .synctag.syncing { color: var(--accent); }
  .pet .badge { margin-left: auto; flex: none; padding: 6px 12px; border-radius: 999px; background: #e8893b; color: #fff; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <a class="synctag" id="syncTag" href="sync.html" hidden></a>
  <h1>知识图谱</h1>
  <p class="muted">福建中考 · 从小学一路走到初三</p>
  <a class="pet" id="petCard" href="pet/index.html"><span class="ico">🐶</span><div><h2>领养一只小狗</h2><p>掌握知识点就能领骨头，喂它长大</p></div></a>
  <div class="grid">
    <div class="group">主科</div>
    <a class="card" href="math-map/index.html"><span class="ico" style="background:#e3edfc">📐</span><div><h2>数学</h2><p>三年级 → 九年级</p></div></a>
    <a class="card" href="chinese-map/index.html"><span class="ico" style="background:#fbe9e4">📖</span><div><h2>语文</h2><p>四年级 → 初三</p></div></a>
    <a class="card" href="english-map/index.html"><span class="ico" style="background:#e6f4ea">🔤</span><div><h2>英语</h2><p>四年级 → 初三</p></div></a>
    <div class="group">理科</div>
    <a class="card" href="science-map/physics.html"><span class="ico" style="background:#fff3d6">⚡</span><div><h2>物理</h2><p>八年级上 → 九年级</p></div></a>
    <a class="card" href="science-map/chemistry.html"><span class="ico" style="background:#efe6fb">⚗️</span><div><h2>化学</h2><p>九年级上 → 九年级下</p></div></a>
    <div class="group">生物 · 历史</div>
    <a class="card" href="bio-history-map/biology.html"><span class="ico" style="background:#e3f6ec">🌱</span><div><h2>生物</h2><p>七年级上 → 八年级下</p></div></a>
    <a class="card" href="bio-history-map/history.html"><span class="ico" style="background:#f6ecdf">📜</span><div><h2>历史</h2><p>七年级上 → 九年级下</p></div></a>
    <div class="group">其它技能</div>
    <a class="card" href="skills-map/notes.html"><span class="ico" style="background:#fde8ef">📝</span><div><h2>学做笔记</h2><p>康奈尔 · 导图 · 错题本</p></div></a>
  </div>
  <footer><span>版本 __VERSION__</span><a class="data" href="data.html">💾 我的数据</a><a class="data" href="sync.html">🔄 设备同步</a><button id="btnUpdate" hidden>检查更新</button></footer>
<script src="km-data.js"></script>
<script src="km-study.js"></script>
<script src="pet/pet-core.js"></script>
<script>
  // 小狗卡片：名字、等级、饱食度、待领骨头
  // 只显示、不写回：饱食度按 tick 折算到现在只用来画卡片（宠物页、发骨头时各自会折算），小部件自己按 tick 算。
  // 以前这里 tick + save 写回本机，而合并了别的设备的改动（km-sync-merged）也会调到这里：每合并一次就多一个新的 tick、
  // 新的修改时间 → 发布新版本 → 对方合并后同样写回 → 两台都开着总入口时无限互推（#1 第二期真机第 4 轮）
  function renderPet() {
    var P = window.KMPet, saved = P && P.load();
    if (!saved) return;
    var st = P.tick(JSON.parse(JSON.stringify(saved)));
    P.syncWidget(saved);
    var L = P.level(st.xp), f = Math.round(st.fullness), n = P.pending(st).length;
    var color = f < P.HUNGRY ? '#d4553f' : '#e8893b';
    var card = document.getElementById('petCard');
    card.innerHTML = '<span class="ico">' + (f < P.HUNGRY ? '🥺' : '🐕') + '</span><div><h2></h2><p>饱食度<span class="meter"><i style="width:' + f + '%;background:' + color + '"></i></span>　🦴 ' + st.bones +
      (f < P.HUNGRY ? '　<b style="color:' + color + '">饿了</b>' : '') + '　📚 今天学习 ' + Math.round(KMStudy.secondsOn(KMStudy.load(), KMStudy.dayKey()) / 60) + ' 分钟</p></div>' +
      (n ? '<span class="badge">+' + n * P.BONES_PER_NODE + ' 🦴 待领取</span>' : noWidget() ? '<span class="badge" style="background:#2f6fde">📌 把小狗放到桌面</span>' : '');
    card.querySelector('h2').textContent = st.name + ' · Lv.' + L + ' ' + P.stage(L).name;
    card.href = !n && noWidget() ? 'pet/index.html#pin' : 'pet/index.html';   // #pin：宠物页直接打开“放到桌面”说明
  }
  // 平板 App 里、桌面上还没有小狗小部件
  function noWidget() {
    try { return !!(window.KMApp && KMApp.widgetCount && KMApp.widgetCount() === 0); } catch (e) { return false; }
  }
  renderPet();
  window.addEventListener('pageshow', renderPet);   // 从图谱或宠物页返回时刷新
  // #1 设备同步：合并了别的设备的改动后刷新小狗卡片；状态变了刷新右上角标签（km-sync.js 由打包时注入）
  window.addEventListener('km-sync-merged', renderPet);
  function renderSync() {
    var tag = document.getElementById('syncTag'), st = window.KMSync && KMSync.state(), t = window.KMSync ? KMSync.tagText(st) : '';
    tag.hidden = !t;
    tag.textContent = t;
    tag.className = 'synctag' + (st && st.status ? ' ' + st.status : '');
  }
  window.addEventListener('km-sync', function (e) { if (e.detail && e.detail.type === 'state') renderSync(); });
  window.addEventListener('pageshow', renderSync);
  if (window.KMApp && KMApp.ready) KMApp.ready().then(renderSync);
</script>
<script>
  // 只有在平板 App 里才有更新按钮
  if (window.KMApp && KMApp.checkUpdate) {
    var b = document.getElementById('btnUpdate');
    b.hidden = false;
    b.onclick = function () { KMApp.checkUpdate(); };
  }
</script>
</body>
</html>
