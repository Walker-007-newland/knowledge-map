<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>km-sync 测试</title>
<style>
  :root { --bg: #f6f4ef; --text: #1f2328; --good: #2f8a4c; --bad: #c23f2e; --muted: #6b6f76; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17181b; --text: #e8e6e1; --good: #5cbf7a; --bad: #ef7a68; --muted: #9a9ca3; } }
  :root[data-theme="dark"] { --bg: #17181b; --text: #e8e6e1; --good: #5cbf7a; --bad: #ef7a68; --muted: #9a9ca3; }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--text); font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #sum { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .ok { color: var(--good); } .bad { color: var(--bad); }
  li { margin: 2px 0; overflow-wrap: anywhere; } small { color: var(--muted); }
  iframe { width: 100%; max-width: 420px; height: 760px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<h1>km-sync.js、设备同步页、总入口标签（模拟原生桥）</h1>
<p><small>#1 第一期验收第 12 条的浏览器部分。用本地服务器打开（如 http://localhost:8781/issue-1/knowledge-map-app/hub/tests/sync-test.html），不需要 Java 后端。
会临时改本页所在网址的 localStorage，跑完还原。结果也在 window.__results。</small></p>
<div id="sum">运行中…</div>
<ol id="out"></ol>
<iframe id="fr" title="设备同步页"></iframe>
<script>window.__kmSyncTest = 1;</script>
<script src="../km-data.js"></script>
<script src="../km-study.js"></script>
<script src="../pet/pet-core.js"></script>
<script src="../km-sync.js"></script>
<script src="../vendor/jsQR.js"></script>
<script src="../vendor/qrcode.js"></script>
<script>
(async function () {
  const D = KMData, S = KMSync, canon = D._canon;
  const out = document.getElementById('out');
  const res = { pass: 0, fail: 0, failures: [], done: false };
  window.__results = res;
  let cur = '';
  function log(ok, msg) {
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'bad';
    li.textContent = (ok ? '✓ ' : '✗ ') + cur + '：' + msg;
    out.appendChild(li);
    if (ok) res.pass++; else { res.fail++; res.failures.push(cur + '：' + msg); }
  }
  const eq = (a, b, msg) => { const ok = canon(a) === canon(b); log(ok, msg + (ok ? '' : '　实际 ' + canon(a) + '　期望 ' + canon(b))); };
  const ok = (v, msg) => log(!!v, msg);
  async function test(name, fn) { cur = name; try { await fn(); } catch (e) { log(false, '抛出异常 ' + (e && e.stack || e)); } }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function until(fn, ms) { const t = Date.now(); while (Date.now() - t < (ms || 3000)) { const v = fn(); if (v) return v; await wait(30); } return fn(); }

  // ---------------- 模拟原生桥（同 KMApp 的同步方法）
  const calls = [];
  let mockState = { inGroup: false, notice: '', me: { dev: 'devA', name: '家里的平板' }, members: [], inbox: 0, pending: 0, status: 'none', error: '', lastOk: 0 };
  let inbox = [];
  let target = null;           // 事件发到哪个窗口（本页或 iframe 里的 sync.html）
  const mock = {
    ready: () => Promise.resolve(), isReady: () => true,
    syncState: () => JSON.stringify(mockState),
    syncTake: () => JSON.stringify(inbox),
    joinState: () => '{}',
    syncAck: j => { calls.push(['syncAck', j]); const ids = JSON.parse(j).map(x => x.id); inbox = inbox.filter(t => ids.indexOf(t.id) < 0); },
    syncPublish: j => calls.push(['syncPublish', j]),
    syncNow: () => calls.push(['syncNow']),
    nodeJoin: t => calls.push(['nodeJoin', t]),
    nodeRemove: () => calls.push(['nodeRemove']),
    joinOpen: () => calls.push(['joinOpen']),
    joinClose: () => calls.push(['joinClose']),
    joinScan: t => calls.push(['joinScan', t]),
    joinConfirm: v => calls.push(['joinConfirm', v]),
    syncRename: (d, n) => calls.push(['syncRename', d, n]),
    syncRemove: d => calls.push(['syncRemove', d]),
    syncLeave: () => calls.push(['syncLeave']),
    saveFile: (n, t) => calls.push(['saveFile', n, t.length])
  };
  // 第二期（局域网配对）的接口：只在「局域网配对」那组测试里装上，第一期的测试仍按没有这些接口的桥跑
  const lanApi = {
    pairOpen: () => calls.push(['pairOpen']),
    pairClose: () => calls.push(['pairClose']),
    pairWith: k => calls.push(['pairWith', k]),
    pairAddr: a => calls.push(['pairAddr', a]),
    pairConfirm: v => calls.push(['pairConfirm', v])
  };
  window.__kmMockApp = mock;
  const emit = (type, data) => (target || window).__kmSyncEvent(type, JSON.stringify(data || {}));
  const called = m => calls.filter(c => c[0] === m);

  const saved = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); saved[k] = localStorage.getItem(k); }

  const sec = (dev, devName, k, data, meta, id, rev) => ({ id: id || 'inbox/' + (dev + k).replace(/[^0-9a-z]/g, '').padEnd(20, '0').slice(0, 20) + '.json', rev: rev || 1, dev, devName, name: k,
    content: canon(Object.assign({ k, s: 1, data }, meta ? { meta } : {})), t: 1 });

  try {
    await test('分区与规范化', () => {
      const pkg = { device: { id: 'A' }, keys: { 'fjzk-zh-progress-v1': { n2: { b: 1, a: 2 }, n1: { best: 90 } }, 'km-pet-v1': { name: '旺财', breed: 'shiba' } },
        meta: { 'fjzk-zh-progress-v1': { n1: { t: 5 } }, 'km-meta-v1': { x: 1 }, 'mathmap-wrong-v1': { 'c#2': { x: 9 } } } };
      const s = S.sections(pkg);
      eq(s.map(x => x.name), ['fjzk-zh-progress-v1', 'km-pet-v1', 'mathmap-wrong-v1'], '一个键一个分区，按名字排序；只在 meta 里有的键（删除记录）也发出去；内部键不发');
      const c = JSON.parse(s[0].content);
      eq(c, { k: 'fjzk-zh-progress-v1', s: 1, data: pkg.keys['fjzk-zh-progress-v1'], meta: { n1: { t: 5 } } }, '分区内容 {k, s, data, meta}');
      ok(s[0].content === canon(c) && s[0].content.indexOf(' ') < 0 && s[0].content.indexOf('"n1"') < s[0].content.indexOf('"n2"'), '内容是规范化 JSON（键名排序、无空格）');
      const pkg2 = { device: { id: 'B' }, keys: { 'km-pet-v1': { breed: 'shiba', name: '旺财' }, 'fjzk-zh-progress-v1': { n1: { best: 90 }, n2: { a: 2, b: 1 } } }, meta: { 'mathmap-wrong-v1': { 'c#2': { x: 9 } }, 'fjzk-zh-progress-v1': { n1: { t: 5 } } } };
      eq(S.sections(pkg2), s, '内容相同、属性顺序不同 → 分区内容逐字相同（两台设备 cid 才会一样）');
      ok(!S.sections({ keys: { group: 1 } }).length, '名为 group 的键不发（是 Java 的组名单分区）');
    });

    await test('合并收件箱', () => {
      const local = { device: { id: 'A', name: 'A' }, keys: { 'fjzk-zh-progress-v1': { n1: { viewed: 100, best: 90, last: 60, attempts: 3, updated: 2000 } } }, meta: {} };
      const taken = [
        sec('B', '学校的平板', 'fjzk-zh-progress-v1', { n1: { viewed: 50, best: 70, last: 85, attempts: 2, updated: 1000 } }),
        sec('C', '妈妈的手机', 'fjzk-en-progress-v1', { e1: { best: 100 } }),
        Object.assign(sec('C', '妈妈的手机', 'km-future-v9', { x: 1 }), { content: canon({ k: 'km-future-v9', s: 99, data: { x: 1 } }) }),
        Object.assign(sec('B', '学校的平板', 'bad', 1), { content: '{坏的' })
      ];
      const m = S.mergeTaken(local, taken);
      eq(m.result.keys['fjzk-zh-progress-v1'].n1, { viewed: 50, best: 90, last: 60, attempts: 3, updated: 2000 }, '按 KMData.merge 合并（best=90、last=60）');
      ok(m.result.keys['fjzk-en-progress-v1'], '另一台设备的英语进度合进来');
      ok(m.changed && m.reports.length === 2, '两台设备各一份报告');
      ok(/从「学校的平板」同步/.test(S.reportText(m.reports)), '报告文字：' + S.reportText(m.reports));
      eq(m.newer, 1, 'schema 比本机新的分区不合并');
      ok(m.acks.length === 3 && !m.acks.some(a => a.id === taken[2].id), '更新版本的分区不确认（留在收件箱），坏分区确认丢掉');
      const m3 = S.mergeTaken(m.result, taken.concat(taken, taken));
      eq(m3.result.keys, m.result.keys, '同一批分区重复 3 次再合并，结果不变');
      ok(!m3.changed, '重复合并报告「没有变化」');
    });

    await test('状态文字', () => {
      eq(S.tagText({ inGroup: false, status: 'none' }), '', '没加入组：总入口不显示标签');
      eq(S.tagText(null), '', '没有桥：不显示');
      eq(S.tagText({ inGroup: true, status: 'ok' }), '✓ 已同步', '已同步');
      eq(S.tagText({ inGroup: true, status: 'syncing' }), '⟳ 同步中', '同步中');
      eq(S.tagText({ inGroup: true, status: 'pending' }), '待同步', '待同步');
      eq(S.tagText({ inGroup: true, status: 'error' }), '⚠ 同步出错', '出错');
      eq(S.tagText({ inGroup: true, status: 'offline' }), '⚠ 同步出错', '连不上节点也算出错');
      ok(/连不上/.test(S.statusText({ inGroup: true, status: 'offline' })), '同步页：连不上节点');
      eq(S.statusText({ inGroup: true, status: 'error', error: '邀请码已失效，请向管理员要新的' }), '邀请码已失效，请向管理员要新的', '同步页：显示内核给的中文错误');
      ok(/已被移出/.test(S.statusText({ inGroup: false, notice: '这台设备已被移出同步组，本机数据还在' })), '同步页：被移出的提示');
      ok(/已同步/.test(S.statusText({ inGroup: true, status: 'ok', lastOk: Date.now(), members: [{ me: false, name: '学校的平板', last: Date.now() }] })), '同步页：已同步 + 时间');
    });

    await test('安全页面判断', () => {
      const L = p => ({ protocol: 'file:', pathname: p });
      ok(S.isSafePage(L('/android_asset/www/index.html')), '总入口是安全页面');
      ok(S.isSafePage(L('/android_asset/www/sync.html')) && S.isSafePage(L('/android_asset/www/data.html')) && S.isSafePage(L('/android_asset/www/pet/study.html')), '同步页、我的数据、学习统计是安全页面');
      ok(!S.isSafePage(L('/android_asset/www/math-map/index.html')) && !S.isSafePage(L('/android_asset/www/pet/index.html')) && !S.isSafePage(L('/android_asset/www/skills-map/notes.html')), '图谱页、宠物页、笔记页不是');
      ok(!S.isSafePage({ protocol: 'https:', pathname: '/index.html' }), 'https 虚拟地址（听写页）不是');
    });

    await test('图谱页收到 inbox 事件不写本机，回到总入口才合并', async () => {
      localStorage.clear();
      localStorage.setItem('fjzk-zh-progress-v1', JSON.stringify({ n1: { viewed: 100, best: 90, last: 60, attempts: 3, updated: 2000 } }));
      D._flush();
      mockState = Object.assign({}, mockState, { inGroup: true, status: 'pending' });
      S._init(mock);
      inbox = [sec('devB', '学校的平板', 'fjzk-en-progress-v1', { e1: { viewed: 1, best: 100, last: 100, attempts: 1, updated: 5 } })];
      const before = JSON.stringify(Object.assign({}, localStorage));
      emit('inbox', { n: 1 });
      await wait(50);
      eq(JSON.stringify(Object.assign({}, localStorage)), before, '本页不是安全页面：inbox 事件之后 localStorage 一个字都没变');
      ok(inbox.length === 1 && !called('syncAck').length, '数据留在原生收件箱，没有确认');
      const r = S.mergeNow({ force: true });
      ok(r.merged && JSON.parse(localStorage.getItem('fjzk-en-progress-v1')).e1.best === 100, '在安全页面上合并：英语进度写进本机');
      ok(called('syncAck').length === 1 && !inbox.length, '合并后 syncAck，收件箱清空');
      const pub = called('syncPublish');
      ok(pub.length >= 1 && JSON.parse(pub[pub.length - 1][1]).sections.some(s => s.name === 'fjzk-en-progress-v1'), '合并后重新发布（含刚合进来的分区）');
      const n = called('syncPublish').length;
      S.publish();
      eq(called('syncPublish').length, n, '内容没变时不重复发布');
      localStorage.setItem('fjzk-zh-progress-v1', JSON.stringify({ n1: { viewed: 100, best: 95, last: 95, attempts: 4, updated: 3000 } }));
      D._flush();
      await until(() => called('syncPublish').length > n, 7000);
      ok(called('syncPublish').length > n, '本机数据变了（km-data-change）5 秒后自动发布');
      mockState = Object.assign({}, mockState, { inGroup: false, status: 'none' });
      S._reset();
      const n2 = called('syncPublish').length;
      S.publish();
      eq(called('syncPublish').length, n2, '没加入同步组时不发布');
    });

    await test('二维码：qrcode.js 生成、jsQR 解回原文', () => {
      const texts = ['kmnode:1?h=43.142.41.27&p=8787&i=7g83ttm4&s=ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', 'kmjoin:1?h=43.142.41.27&p=8787&s=ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
      texts.forEach(t => {
        const q = qrcode(0, 'M'); q.addData(t); q.make();
        const n = q.getModuleCount(), quiet = 4, cell = 6, size = (n + quiet * 2) * cell;
        const c = document.createElement('canvas'); c.width = c.height = size;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
        for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
        const r = jsQR(g.getImageData(0, 0, size, size).data, size, size);
        eq(r && r.data, t, (t.startsWith('kmnode') ? '邀请码' : '加入码') + '解回原文');
      });
    });

    await test('设备同步页（iframe + 模拟桥）', async () => {
      calls.length = 0;
      mockState = { inGroup: false, notice: '', me: { dev: 'devA', name: '家里的平板' }, members: [], inbox: 0, pending: 0, status: 'none', error: '', lastOk: 0 };
      const fr = document.getElementById('fr');
      fr.src = '../sync.html?t=' + Date.now();
      await new Promise(r => { fr.onload = r; });
      const w = fr.contentWindow, d = fr.contentDocument;
      target = w;
      const $ = id => d.getElementById(id);
      // 真的看得见：computed display 不是 none、而且占了位置（只查 .hidden 会漏掉被 CSS display 盖掉的 hidden）
      const vis = el => !!el && w.getComputedStyle(el).display !== 'none' && el.getClientRects().length > 0;
      await until(() => !$('statusCard').hidden);
      ok(vis($('start')) && !vis($('group')), '没加入组：显示「扫邀请码，开始同步」「扫加入码」');
      ok(!vis($('btnRejoin')) && !vis($('noApp')) && !vis($('joinWait')) && !vis($('more')), '没加入组：看不到「退出同步组，重新加入」「其它」和等待确认（按实际显示判断）');
      ok(/扫邀请码/.test($('start').textContent) && /扫加入码/.test($('start').textContent), '两个大按钮都在');
      // 手动输入：格式错
      $('manual').value = 'hello';
      $('btnManual').click();
      ok(/不是同步用的二维码/.test($('startMsg').textContent), '格式错：' + $('startMsg').textContent);
      $('manual').value = 'kmadmin:1?h=1&p=2&k=3';
      $('btnManual').click();
      ok(/管理码/.test($('startMsg').textContent), '扫到管理码：提示去审批 App');
      // 手动输入加入码
      $('manual').value = '43.142.41.27:8787 · ABCD-EFGH-IJKL-MNOP-QRST-UVWX-YZ';
      $('btnManual').click();
      ok(called('joinScan').length === 1, '手输「地址 · 26 位码」→ joinScan');
      emit('join-request', { role: 'guest', name: '家里的平板', code: '0427' });
      ok(vis($('joinWait')) && $('joinWaitCode').textContent === '0427' && /家里的平板/.test($('joinWaitText').textContent), '新设备显示「请在『家里的平板』上确认」和确认码');
      emit('join-result', { role: 'guest', ok: false, msg: '「家里的平板」上点了拒绝' });
      ok(!vis($('joinWait')) && /拒绝/.test($('startMsg').textContent), '被拒绝：中文提示');
      // 已加入组
      mockState = { inGroup: true, notice: '', me: { dev: 'devA', name: '家里的平板' }, status: 'ok', error: '', lastOk: Date.now() - 60000, inbox: 0, pending: 0,
        members: [{ dev: 'devA', name: '家里的平板', me: true, last: 0, via: '节点' }, { dev: 'devB', name: '学校的平板', me: false, last: Date.now() - 120000, via: '节点' }],
        node: { h: '43.142.41.27', p: 8787, off: false, last: Date.now() - 60000, error: '', msg: '' } };
      emit('state', mockState);
      ok(!vis($('start')) && vis($('group')), '已加入：显示「我的设备」');
      ok(!vis($('btnRejoin')) && !vis($('addBox')) && vis($('btnAdd')), '已同步：看不到「退出同步组，重新加入」，加入码框收着');
      ok(/学校的平板/.test($('devices').textContent) && /本机/.test($('devices').textContent) && /同步节点 43\.142\.41\.27:8787/.test($('devices').textContent), '列出本机、组员、同步节点一行');
      ok(/已同步/.test($('status').textContent), '顶部状态：' + $('status').textContent);
      ok(d.querySelectorAll('[data-remove]').length === 1, '只有别的设备才有「移除」按钮');
      // 添加设备：显示加入码二维码，能被 jsQR 解回
      // 「正在同步…」：状态经过「同步中」回到已同步后收起
      $('btnSync').click();
      ok(vis($('groupMsg')) && /正在同步/.test($('groupMsg').textContent), '点「立即同步」显示「正在同步…」');
      const okState = mockState;
      mockState = Object.assign({}, okState, { status: 'syncing' });
      emit('state', mockState);
      ok(vis($('groupMsg')), '同步中时还显示');
      mockState = okState;
      emit('state', mockState);
      ok(!vis($('groupMsg')), '同步完（状态回到已同步）后「正在同步…」消失');
      $('btnAdd').click();
      ok(vis($('groupMsg')) && /正在生成加入码/.test($('groupMsg').textContent), '点「添加设备」显示「正在生成加入码…」');
      ok(called('joinOpen').length === 1, '点「添加设备」→ joinOpen');
      const text = 'kmjoin:1?h=43.142.41.27&p=8787&s=ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      emit('join-code', { text, display: '43.142.41.27:8787 · ABCD-EFGH', exp: Date.now() + 600000 });
      ok(!vis($('groupMsg')), '加入码显示出来后「正在生成加入码…」消失');
      const cv = await until(() => $('qrCanvas'));
      const r = cv && jsQR(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
      eq(r && r.data, text, '页面上显示的加入码二维码能被 jsQR 解回原文');
      ok(vis($('addBox')) && !vis($('btnAdd')), '显示加入码时「添加设备」按钮真的藏起来');
      ok(/还剩 9 分/.test($('joinLeft').textContent), '10 分钟倒计时：' + $('joinLeft').textContent);
      emit('join-request', { role: 'host', name: '妈妈的手机', code: '1234' });
      const modal = await until(() => d.querySelector('.modal'));
      ok(modal && /妈妈的手机/.test(modal.textContent) && /1234/.test(modal.textContent) && /只加入同一个学生自己的设备/.test(modal.textContent), '确认弹窗：名字、确认码、合并警告');
      modal.querySelector('#mYes').click();
      ok(called('joinConfirm').length === 1 && called('joinConfirm')[0][1] === true, '点「数字一样，加入」→ joinConfirm(true)');
      emit('join-result', { role: 'host', ok: true, name: '妈妈的手机', msg: '「妈妈的手机」已加入' });
      ok(!vis($('addBox')) && /已加入/.test($('groupMsg').textContent), '加入成功：收起加入码，提示已加入');
      // 各种错误状态
      for (const [status, error, re] of [['offline', '同步节点连不上', /连不上/], ['error', '同步节点拒绝了这个同步组', /拒绝/], ['error', '邀请码已失效，请向管理员要新的', /邀请码已失效/], ['syncing', '', /正在同步/]]) {
        mockState = Object.assign({}, mockState, { status, error });
        emit('state', mockState);
        ok(re.test($('status').textContent), status + ' 状态显示：' + $('status').textContent);
      }
      // 同步组已过期（60 天限制）
      mockState = Object.assign({}, mockState, { status: 'error', error: '同步组已过期，请重新加入：这台设备超过 60 天没同步，你的其它设备可能已经换了同步钥匙。请点下面的「退出同步组」……',
        node: Object.assign({}, mockState.node, { error: 'expired', msg: '同步组已过期，请重新加入' }) });
      emit('state', mockState);
      ok(/同步组已过期，请重新加入/.test($('status').textContent) && vis($('btnRejoin')), '同步组已过期：顶部明确提示，并显示「退出同步组，重新加入」按钮');
      w.confirm = () => true;
      $('btnRejoin').click();
      ok(called('syncLeave').length === 1, '点「退出同步组，重新加入」→ syncLeave');
      calls.length = 0;
      mockState = Object.assign({}, mockState, { status: 'ok', error: '', node: Object.assign({}, mockState.node, { error: '', msg: '' }) });
      emit('state', mockState);
      ok(!vis($('btnRejoin')), '恢复正常后不再显示重新加入按钮');
      // 移除 / 改名 / 退出（confirm 由测试替换成同意）
      w.confirm = () => true;
      d.querySelector('[data-remove="devB"]').click();
      ok(called('syncRemove').length === 1 && called('syncRemove')[0][1] === 'devB', '移除 → syncRemove(devB)');
      d.querySelector('[data-rename="devB"]').click();
      const m2 = await until(() => d.querySelector('.modal #mText'));
      m2.value = '书房的平板';
      d.querySelector('.modal #mYes').click();
      ok(called('syncRename').length === 1 && called('syncRename')[0][2] === '书房的平板', '改名 → syncRename');
      $('btnLeave').click();
      ok(called('syncLeave').length === 1, '退出同步组 → syncLeave');
      // 被移出
      mockState = { inGroup: false, notice: '这台设备已被移出同步组，本机数据还在', me: { dev: 'devA', name: '家里的平板' }, members: [], status: 'none', error: '', lastOk: 0, inbox: 0, pending: 0 };
      emit('state', mockState);
      ok(/已被移出/.test($('notice').textContent) && vis($('start')), '被移出：显示提示，回到「开始同步」');
      // 同步内核建不出来（Keystore、写盘出错）：只显示原因，不给建组按钮
      mockState = { inGroup: false, unavailable: true, status: 'none', members: [], notice: '设备同步暂时不可用（Keystore 加密失败：模拟），不影响学习；可以重启 App 再试' };
      emit('state', mockState);
      ok(vis($('notice')) && /暂时不可用/.test($('notice').textContent) && !vis($('start')) && !vis($('group')) && !vis($('btnRejoin')), '同步不可用：显示原因，看不到建组、加入按钮');
      const errs = w.__errs || [];
      ok(!errs.length, '同步页没有脚本错误');
      target = null;
    });

    await test('第二期：局域网配对（同步页 iframe + 模拟桥）', async () => {
      calls.length = 0;
      Object.assign(mock, lanApi);
      const lan0 = { on: true, addr: '192.168.1.23:47811', disc: 0, online: [], nearby: [], lastOk: 0 };
      mockState = { inGroup: false, notice: '', me: { dev: 'devA', name: '家里的平板' }, members: [], inbox: 0, pending: 0, status: 'none', error: '', lastOk: 0, lan: lan0 };
      const fr = document.getElementById('fr');
      fr.src = '../sync.html?t=' + Date.now();
      await new Promise(r => { fr.onload = r; });
      const w = fr.contentWindow, d = fr.contentDocument;
      target = w;
      const $ = id => d.getElementById(id);
      const vis = el => !!el && w.getComputedStyle(el).display !== 'none' && el.getClientRects().length > 0;
      await until(() => !$('statusCard').hidden);
      ok(vis($('btnLanStart')) && /同一个 Wi-Fi/.test($('btnLanStart').textContent) && !vis($('lanCard')), '没加入组：有「和同一个 Wi-Fi 下的设备配对」按钮，配对卡片收着');
      $('btnLanStart').click();
      ok(called('pairOpen').length === 1, '点它 → pairOpen');
      emit('action-result', { op: 'pairOpen', ok: false, msg: '没连 Wi-Fi：局域网配对要两台设备连同一个 Wi-Fi（也可以一台开手机热点，另一台连上去）' });
      ok(/没连 Wi-Fi/.test($('startMsg').textContent), '没连 Wi-Fi：中文提示 ' + $('startMsg').textContent);
      // 可被发现 3 分钟：显示本机地址、倒计时、附近的设备
      mockState = Object.assign({}, mockState, { lan: Object.assign({}, lan0, { disc: Date.now() + 180000 }) });
      emit('pair-open', { ok: true, addr: lan0.addr, exp: mockState.lan.disc, list: [] });
      ok(vis($('lanCard')) && $('lanAddr').textContent === '192.168.1.23:47811' && /还剩 [23] 分/.test($('lanLeft').textContent), '可被发现：显示本机地址和 3 分钟倒计时：' + $('lanLeft').textContent);
      ok(/还没找到/.test($('lanList').textContent), '附近还没有设备：说明要对方也打开「添加设备」');
      emit('peers', { list: [{ key: 'km-ab12', name: '书房的平板' }] });
      const pb = d.querySelector('[data-peer="km-ab12"]');
      ok(pb && /书房的平板/.test(pb.textContent), '附近的设备出现在列表里');
      pb.click();
      ok(called('pairWith').length === 1 && called('pairWith')[0][1] === 'km-ab12', '点它 → pairWith(km-ab12)');
      $('lanAddrIn').value = 'hello world';
      $('btnLanAddr').click();
      ok(!called('pairAddr').length && /格式不对/.test($('lanMsg').textContent), '手输地址格式错：中文提示');
      $('lanAddrIn').value = '192.168.1.40:47811';
      $('btnLanAddr').click();
      ok(called('pairAddr').length === 1 && called('pairAddr')[0][1] === '192.168.1.40:47811', '手输地址 → pairAddr');
      // 两边弹确认码
      emit('pair-request', { role: 'client', name: '书房的平板', code: '4821' });
      const modal = await until(() => d.querySelector('.modal.pair'));
      ok(modal && /书房的平板/.test(modal.textContent) && /4821/.test(modal.textContent) && /只配对同一个学生自己的设备/.test(modal.textContent) && /不一样，取消/.test(modal.textContent),
        '确认弹窗：对方名字、大号 4 位确认码、合并警告、「不一样，取消」');
      modal.querySelector('#mYes').click();
      ok(called('pairConfirm').length === 1 && called('pairConfirm')[0][1] === true && /等「书房的平板」/.test($('lanMsg').textContent), '点「数字一样，配对」→ pairConfirm(true)，提示等对方确认');
      emit('pair-request', { role: 'server', name: '妈妈的手机', code: '1111' });
      const m2 = await until(() => d.querySelector('.modal.pair'));
      m2.querySelector('#mNo').click();
      ok(called('pairConfirm').length === 2 && called('pairConfirm')[1][1] === false && !d.querySelector('.modal.pair'), '点「不一样，取消」→ pairConfirm(false)，弹窗关掉');
      emit('pair-result', { ok: false, role: 'client', name: '书房的平板', msg: '「书房的平板」上点了「不一样」，没有配对' });
      ok(/没有配对/.test($('lanMsg').textContent), '配对失败：卡片里显示原因');
      // 配对成功（第一次）：先备份，再显示「已配对，正在第一次同步」
      const saves = called('saveFile').length;
      const pubs0 = called('syncPublish').length, now0 = called('syncNow').length;
      emit('pair-request', { role: 'client', name: '书房的平板', code: '4821' });
      mockState = { inGroup: true, notice: '', me: { dev: 'devA', name: '家里的平板' }, status: 'pending', error: '', lastOk: 0, inbox: 0, pending: 2, node: null,
        members: [{ dev: 'devA', name: '家里的平板', me: true, last: 0, via: '局域网', near: false }, { dev: 'devB', name: '书房的平板', me: false, last: Date.now() - 30000, via: '局域网', near: true }],
        lan: Object.assign({}, lan0, { disc: 0, online: ['devB'] }) };
      emit('pair-result', { ok: true, role: 'client', name: '书房的平板', first: true, msg: '已和「书房的平板」配对，正在第一次同步…' });
      ok(called('saveFile').length === saves + 1 && /同步前备份/.test(called('saveFile')[saves][1]), '第一次配对成功：先在「下载/知识图谱」里备份一份');
      ok(!d.querySelector('.modal.pair') && /已和「书房的平板」配对/.test($('groupMsg').textContent) && /正在第一次同步/.test($('groupMsg').textContent) && /备份/.test($('groupMsg').textContent), '提示已配对、正在第一次同步、备份在哪');
      ok(called('syncPublish').length === pubs0 + 1 && called('syncNow').length === now0 + 1, '配对成功后马上发布本机数据（syncPublish）并同步一轮（syncNow），不用等离开页面或点「立即同步」');
      emit('state', mockState);
      ok(/正在第一次同步/.test($('groupMsg').textContent), '还没同步完（待同步）：仍显示「正在第一次同步…」');
      const pendingState = mockState;
      mockState = Object.assign({}, mockState, { status: 'ok', lastOk: Date.now(), pending: 0 });
      emit('state', mockState);
      mockState = pendingState;
      ok(/已和「书房的平板」配对，第一次同步完成/.test($('groupMsg').textContent) && !/正在第一次同步/.test($('groupMsg').textContent), '第一次同步完成后换成结果：' + $('groupMsg').textContent);
      // 非第一次（本机已有组、把对方加进来）也要马上发布、同步
      const pubs1 = called('syncPublish').length, now1 = called('syncNow').length;
      w.KMSync._reset();
      emit('pair-result', { ok: true, role: 'server', name: '妈妈的手机', first: false, msg: '已和「妈妈的手机」配对' });
      ok(called('syncPublish').length === pubs1 + 1 && called('syncNow').length === now1 + 1 && /已和「妈妈的手机」配对/.test($('groupMsg').textContent), '给出组包的一方（非第一次）配对成功后也马上发布并同步');
      emit('pair-result', { ok: false, role: 'client', name: '书房的平板', msg: '已取消，没有配对' });
      ok(called('syncPublish').length === pubs1 + 1, '配对失败不发布');
      emit('state', mockState);
      ok(vis($('group')) && !vis($('lanCard')) && !vis($('start')), '配对后显示「我的设备」，配对卡片收起');
      ok(/局域网/.test($('devices').textContent) && /在附近/.test($('devices').textContent) && /只在同一个 Wi-Fi 下同步/.test($('devices').textContent),
        '设备列表：途径「局域网」、「在附近」，没有节点时说明只在同一个 Wi-Fi 下同步');
      // 没有节点的组：「添加设备」只开局域网配对，不生成加入码
      calls.length = 0;
      $('btnAdd').click();
      ok(called('pairOpen').length === 1 && !called('joinOpen').length, '没有同步节点的组点「添加设备」→ 只 pairOpen，不 joinOpen');
      // 附近没有组员时的状态
      mockState = Object.assign({}, mockState, { lan: Object.assign({}, mockState.lan, { online: [] }), members: mockState.members.map(m => Object.assign({}, m, { near: false })) });
      emit('state', mockState);
      ok(/附近没有找到你的设备/.test($('status').textContent), '只有局域网、附近没有组员：' + $('status').textContent);
      mockState = Object.assign({}, mockState, { lan: Object.assign({}, mockState.lan, { on: false }) });
      emit('state', mockState);
      ok(/没连 Wi-Fi/.test($('status').textContent), '只有局域网、没连 Wi-Fi：' + $('status').textContent);
      // 有节点的组：「添加设备」两样都开
      mockState = Object.assign({}, mockState, { node: { h: '43.142.41.27', p: 8787, off: false, last: Date.now(), error: '', msg: '' }, lan: Object.assign({}, lan0) });
      emit('state', mockState);
      calls.length = 0;
      $('btnAdd').click();
      ok(called('pairOpen').length === 1 && called('joinOpen').length === 1, '有同步节点的组点「添加设备」→ 加入码（joinOpen）和局域网配对（pairOpen）都开');
      // 3 分钟到了 / 错 3 次：停止被发现
      mockState = Object.assign({}, mockState, { lan: Object.assign({}, lan0, { disc: Date.now() + 60000 }) });
      emit('state', mockState);
      ok(vis($('lanCard')), '可被发现时卡片显示');
      mockState = Object.assign({}, mockState, { lan: Object.assign({}, lan0, { disc: 0 }) });
      emit('pair-close', { msg: '确认码对不上 3 次，已停止被发现。要再配对，请重新点「添加设备」' });
      emit('state', mockState);
      ok(!vis($('lanCard')) && /3 次/.test($('groupMsg').textContent), '停止被发现：卡片收起，说明原因');
      ok(S.statusText({ inGroup: true, status: 'ok', lastOk: Date.now(), error: '同步节点连不上，局域网同步照常', members: [] }).indexOf('局域网同步照常') > 0, '节点连不上、局域网照常：「已同步 · … · 同步节点连不上，局域网同步照常」');
      const errs = w.__errs || [];
      ok(!errs.length, '同步页没有脚本错误');
      Object.keys(lanApi).forEach(k => delete mock[k]);
      target = null;
    });

    await test('总入口：没加入组时没有状态标签', async () => {
      const fr = document.getElementById('fr');
      fr.src = '../index.html?t=' + Date.now();
      await new Promise(r => { fr.onload = r; });
      const tag = fr.contentDocument.getElementById('syncTag');
      ok(tag && tag.hidden && fr.contentWindow.getComputedStyle(tag).display === 'none', '状态标签默认隐藏（浏览器里、没加入同步组时都不显示）');
      ok(/设备同步/.test(fr.contentDocument.querySelector('footer').textContent), '底部有「设备同步」按钮');
      // 合并提示框（km-sync.js 的 toast）盖在底部按钮上时、淡出后，按钮都点得到
      const fw = fr.contentWindow, fd = fr.contentDocument;
      await new Promise((res, rej) => { const sc = fd.createElement('script'); sc.src = 'km-sync.js'; sc.onload = res; sc.onerror = rej; fd.head.appendChild(sc); });
      fw.scrollTo(0, fd.documentElement.scrollHeight);            // 滚到最底下，让底部按钮在可视区里（和平板上一样）
      const links = Array.from(fd.querySelectorAll('footer a'));
      fw.KMSync.toast('从「学校的平板」同步：数学 新增 4 个知识点记录\n语文 已掌握 6 → 7\n小狗 骨头 20 → 23\n学习时长 46 → 51 分钟', 300);
      const t = fd.getElementById('km-sync-toast');
      const hit = () => links.every(a => { const r = a.getBoundingClientRect(); const e = fd.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return e && a.contains(e); });
      const tr = t.getBoundingClientRect();
      const covers = links.some(a => { const r = a.getBoundingClientRect(); return !(r.right < tr.left || r.left > tr.right || r.bottom < tr.top || r.top > tr.bottom); });
      ok(t && fw.getComputedStyle(t).pointerEvents === 'none', '提示框不接收点击（pointer-events:none）');
      ok(hit(), '提示框显示时，底部「我的数据」「设备同步」的中心点 elementFromPoint 命中的是按钮本身' + (covers ? '（提示框正好盖在按钮上）' : ''));
      await wait(1000);
      ok(!fd.getElementById('km-sync-toast') && hit(), '提示框消失后从页面移除，底部按钮可点击');
    });
  } catch (e) { log(false, '运行出错 ' + e); }
  finally {
    localStorage.clear();
    Object.keys(saved).forEach(k => localStorage.setItem(k, saved[k]));
  }
  res.done = true;
  document.getElementById('sum').innerHTML = '<span class="' + (res.fail ? 'bad' : 'ok') + '">通过 ' + res.pass + ' 项，失败 ' + res.fail + ' 项</span>';
})();
</script>
</body>
</html>
