<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>km-data 单元测试</title>
<style>
  :root { --bg: #f6f4ef; --text: #1f2328; --good: #2f8a4c; --bad: #c23f2e; --muted: #6b6f76; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17181b; --text: #e8e6e1; --good: #5cbf7a; --bad: #ef7a68; --muted: #9a9ca3; } }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--text); font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #sum { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .ok { color: var(--good); } .bad { color: var(--bad); }
  li { margin: 2px 0; } small { color: var(--muted); }
</style>
</head>
<body>
<h1>km-data.js 合并引擎单元测试</h1>
<p><small>用法：用本地服务器打开本页（如 http://localhost:8781/issue-2/knowledge-map-app/hub/tests/test.html）。会临时清空本页所在网址的 localStorage，跑完自动还原。结果也在 window.__results。</small></p>
<div id="sum">运行中…</div>
<ol id="out"></ol>
<script src="../km-data.js"></script>
<script src="../km-study.js"></script>
<script src="../pet/pet-core.js"></script>
<script>
(async function () {
  const D = KMData, P = KMPet, S = KMStudy;
  const out = document.getElementById('out');
  const res = { pass: 0, fail: 0, failures: [] };
  window.__results = res;
  const canon = D._canon;
  let cur = '';
  function log(ok, msg) {
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'bad';
    li.textContent = (ok ? '✓ ' : '✗ ') + cur + '：' + msg;
    out.appendChild(li);
    if (ok) res.pass++; else { res.fail++; res.failures.push(cur + '：' + msg); }
  }
  function eq(a, b, msg) { const ok = canon(a) === canon(b); log(ok, msg + (ok ? '' : '　实际 ' + canon(a) + '　期望 ' + canon(b))); }
  function ok(v, msg) { log(!!v, msg); }
  const NOW = Date.UTC(2026, 9, 20, 8, 0, 0);
  const pk = (dev, keys, meta) => ({ device: { id: dev, name: dev }, keys: keys || {}, meta: meta || {} });
  const M = (a, b) => D.merge(a, b, { now: NOW });
  // 对称 + 幂等：A 合 B = B 合 A；结果再合 A、再合 B 都不变
  function law(name, A, B, C) {
    const ab = M(A, B).result, ba = M(B, A).result;
    if (C) {
      const r1 = M(pk('X', ab.keys, ab.meta), C).result, bc = M(B, C).result, r2 = M(A, pk('Y', bc.keys, bc.meta)).result;
      eq(r1, r2, name + ' 结合律：(A合B)合C = A合(B合C)');
    }
    eq(ab.keys, ba.keys, name + ' 对称（keys）');
    eq(ab.meta, ba.meta, name + ' 对称（meta）');
    const R = pk('R', ab.keys, ab.meta);
    eq(M(R, B).result.keys, ab.keys, name + ' 幂等（结果再合 B 不变）');
    eq(M(R, A).result.keys, ab.keys, name + ' 幂等（结果再合 A 不变）');
    ok(!M(R, B).report.changed, name + ' 再导入一次报告“没有变化”');
    return ab;
  }
  async function test(name, fn) { cur = name; try { await fn(); } catch (e) { log(false, '抛出异常 ' + (e && e.stack || e)); } }

  // 备份本页 localStorage，测试完还原
  const saved = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); saved[k] = localStorage.getItem(k); }
  function resetLS() { localStorage.clear(); }

  try {
    await test('进度（非数学）', () => {
      const A = pk('A', { 'fjzk-zh-progress-v1': { n1: { viewed: 100, best: 90, last: 60, attempts: 3, updated: 2000 } } });
      const B = pk('B', { 'fjzk-zh-progress-v1': { n1: { viewed: 50, best: 70, last: 85, attempts: 2, updated: 1000 }, n2: { viewed: 10, last: null, best: null, attempts: 0 } } });
      const r = law('进度', A, B).keys['fjzk-zh-progress-v1'];
      eq(r.n1, { viewed: 50, best: 90, last: 60, attempts: 3, updated: 2000 }, '验收 5：best=90、last=60（最近一次为准，最好成绩不降），viewed 取早、attempts 取大');
      eq(r.n2, { viewed: 10, last: null, best: null, attempts: 0 }, '只一边有的知识点保留');
      const C = pk('C', { 'fjzk-zh-progress-v1': { n1: { viewed: 5, diag: 'pass', diagInferred: true, diagAt: 3000 } } });
      const E = pk('E', { 'fjzk-zh-progress-v1': { n1: { viewed: 9, diag: 'fail', diagInferred: false, diagAt: 4000 } } });
      eq(law('诊断', C, E).keys['fjzk-zh-progress-v1'].n1, { viewed: 5, diag: 'fail', diagInferred: false, diagAt: 4000 }, 'diag 三项一起取 diagAt 新的');
      const rep = M(B, A).report;
      ok(rep.items.some(x => x.key === 'fjzk-zh-progress-v1' && /1 个最好成绩提高/.test(x.text)), '报告写明最好成绩提高：' + rep.items.map(x => x.name + x.text).join(' / '));
    });

    await test('数学进度', () => {
      const A = pk('A', { 'mathmap-progress-v1': { m1: { best: 0.9, last: 0.5, at: 3000 }, m2: { best: 0.4, last: 0.4, at: 1 } } });
      const B = pk('B', { 'mathmap-progress-v1': { m1: { best: 0.7, last: 0.7, at: 1000 }, m3: { best: 1, last: 1, at: 5 } } });
      const r = law('数学进度', A, B).keys['mathmap-progress-v1'];
      eq(r.m1, { best: 0.9, last: 0.5, at: 3000 }, 'best 取大，last+at 取 at 新的');
      ok(r.m2 && r.m3, '两边各自的知识点都在');
    });

    await test('数学错题本', () => {
      const A = pk('A', { 'mathmap-wrong-v1': { 'a#1': { n: 2, at: 100 }, 'b#0': { n: 1, at: 50 } } }, { 'mathmap-wrong-v1': { 'c#2': { x: 9000, v: { n: 2, at: 500 } } } });
      const B = pk('B', { 'mathmap-wrong-v1': { 'a#1': { n: 1, at: 300 }, 'c#2': { n: 3, at: 2000 }, 'd#4': { n: 1, at: 8000 } } }, { 'mathmap-wrong-v1': { 'c#2': { t: 2000 }, 'd#4': { t: 9500 } } });
      const ab = law('错题', A, B, pk('C', { 'mathmap-wrong-v1': { 'c#2': { n: 5, at: 100 }, 'e#1': { n: 1, at: 7 } } }));
      const r = ab.keys['mathmap-wrong-v1'];
      eq(r['a#1'], { n: 2, at: 300 }, '两边都有：n 取大、at 取新');
      ok(!r['c#2'], '验收 7：A 答对删掉（删除记录更晚），B 还在 → 合并后不回来');
      ok(r['d#4'] && r['b#0'], '只一边有且没有更晚删除记录 → 保留');
      eq(ab.meta['mathmap-wrong-v1']['c#2'], { t: 2000, x: 9000, v: { n: 3, at: 2000 } }, '删除记录（删除时间、删除前内容）保留在合并结果里');
      // 老数据（没有修改记录）也成立：B 的错题 at 早于 A 的删除
      const B0 = pk('B0', { 'mathmap-wrong-v1': { 'c#2': { n: 1, at: 1000 } } });
      ok(!M(A, B0).result.keys['mathmap-wrong-v1']['c#2'], '没有修改记录的老数据按时间 0 / 自带 at 处理');
      // B 后来又做错了（比删除更晚）→ 保留
      const B2 = pk('B2', { 'mathmap-wrong-v1': { 'c#2': { n: 1, at: 9900 } } }, { 'mathmap-wrong-v1': { 'c#2': { t: 9900, by: 'B2' } } });
      ok(M(A, B2).result.keys['mathmap-wrong-v1']['c#2'], '删除之后又做错 → 保留');
      const rep = M(B, A).report.items.find(x => x.key === 'mathmap-wrong-v1');
      ok(rep && /\+1、−1/.test(rep.text), '报告写明错题 +、−：' + (rep && rep.text));
    });

    await test('草稿', () => {
      const K = 'fjzk-zh-drafts-v1';
      const tOld = new Date(2026, 9, 18, 21, 5).getTime(), tNew = new Date(2026, 9, 19, 8, 0).getTime();
      // 每题按设备各存一份版本（watcher 在本机改动时写入 km-meta）
      const ver = (dev, t, node) => { const v = {}; Object.keys(node).forEach(q => { v[q] = { [dev]: Object.assign({ t, text: node[q].text, seen: {} }, node[q].checks ? { checks: node[q].checks } : {}) }; }); return { t, by: dev, vers: v }; };
      const a1 = { 0: { text: '同一段', checks: [true] }, 1: { text: '我的开头', checks: [] }, 2: { text: '新版本作文', checks: [true, true] } };
      const b1 = { 0: { text: '同一段', checks: [false] }, 1: { text: '我的开头，后面写了更多', checks: [true] }, 2: { text: '旧版本作文', checks: [false] }, 3: { text: '只在 B 这题' } };
      const A = pk('A', { [K]: { w1: a1, w2: { 0: { text: '只在 A' } } } }, { [K]: { w1: ver('A', tNew, a1) } });
      const B = pk('B', { [K]: { w1: b1 } }, { [K]: { w1: ver('B', tOld, b1) } });
      const c1 = { 2: { text: '第三台设备写的' } };
      const C = pk('C', { [K]: { w1: c1 } }, { [K]: { w1: ver('C', tOld - 3600000, c1) } });
      const ab = law('草稿', A, B, C);
      const w1 = ab.keys[K].w1;
      eq(w1[0], { text: '同一段', checks: [true] }, '文字相同：保留，checks 取较新的');
      eq(w1[1].text, '我的开头，后面写了更多', '一份是另一份的开头：取长的');
      eq(w1[2].text, '新版本作文\n\n【另一台设备 10-18 21:05 保存的版本】\n旧版本作文', '验收 8：正文为较新的，后面附较旧的');
      eq(w1[2].checks, [true, true], '冲突时 checks 取较新的');
      ok(w1[3] && ab.keys[K].w2, '只一边有的题、知识点都保留');
      const r = M(A, B).report;
      eq(r.conflicts, 1, '报告里草稿冲突数 = 1');
      ok(r.items.some(x => x.key === K && /两份都保留/.test(x.text)), '报告文字提示两份都保留');
      // 三台设备按不同顺序合并：不会重复追加
      const ba = M(B, A).result;
      const abc = M(pk('X', ab.keys, ab.meta), C).result, cba = M(C, pk('Y', ba.keys, ba.meta)).result;
      eq(abc.keys[K].w1[2].text, cba.keys[K].w1[2].text, '三方草稿不同顺序结果相同');
      eq(abc.keys[K].w1[2].text.split('【另一台设备').length - 1, 2, '三份各不相同 → 正文 + 2 份附在后面，不重复');
      const again = M(pk('Z', abc.keys, abc.meta), A).result;
      eq(again.keys[K].w1[2].text, abc.keys[K].w1[2].text, '再合并一次不会越接越长');
      // 在合并后的设备上改了这题：本机版本把其它版本标成看过，正文只剩本机写的
      const vs = JSON.parse(JSON.stringify(abc.meta[K].w1.vers[2]));
      vs.A = { t: tNew + 1000, text: '我改好了', seen: { B: vs.B.t, C: vs.C.t } };
      eq(D.computeDraft(vs).text, '我改好了', '本机改过（看过其它版本）后，正文只有本机这份');
    });

    await test('入门诊断 / 朗读语速 / 不认识的键', () => {
      const A = pk('A', { 'fjzk-en-diag-v1': { done: false, state: { a: 1 } }, 'km-narrate-rate': '1.2', 'fjzk-future-v1': { x: 1 } }, { 'fjzk-en-diag-v1': { '*': { t: 500 } }, 'km-narrate-rate': { '*': { t: 100 } } });
      const B = pk('B', { 'fjzk-en-diag-v1': { done: true, state: { b: 2 } }, 'km-narrate-rate': '0.8', 'fjzk-other-v9': [1, 2] }, { 'fjzk-en-diag-v1': { '*': { t: 400 } }, 'km-narrate-rate': { '*': { t: 200 } } });
      const r = law('整键', A, B).keys;
      eq(r['fjzk-en-diag-v1'], { done: false, state: { a: 1 } }, '诊断取修改时间较新的整份');
      eq(r['km-narrate-rate'], '0.8', '语速取较新的');
      eq([r['fjzk-future-v1'], r['fjzk-other-v9']], [{ x: 1 }, [1, 2]], '清单里没有的键原样保留');
    });

    await test('学习时长', () => {
      const day = '2026-10-18';
      const A = pk('A', { 'km-study-v1': { days: { [day]: { 'fjzk-zh-progress-v1': 1200 } }, byDev: { A: { [day]: { 'fjzk-zh-progress-v1': 1200 } } }, first: { 'fjzk-zh-progress-v1': { n1: '2026-10-18', n2: '2026-10-01' } }, totals: { 'fjzk-zh-progress-v1': 100 }, migrated: 1 } });
      const B = pk('B', { 'km-study-v1': { days: { [day]: { 'fjzk-zh-progress-v1': 900 } }, first: { 'fjzk-zh-progress-v1': { n1: '2026-10-10' } }, totals: { 'fjzk-zh-progress-v1': 120 } } });  // 老格式：没有 byDev
      const r = law('学习时长', A, B).keys['km-study-v1'];
      eq(r.days[day]['fjzk-zh-progress-v1'], 2100, '验收 9：A 20 分钟 + B 15 分钟 = 35 分钟');
      eq(r.first['fjzk-zh-progress-v1'], { n1: '2026-10-10', n2: '2026-10-01' }, 'first 取较早');
      eq(r.totals['fjzk-zh-progress-v1'], 120, 'totals 取较大');
      const R = pk('A', { 'km-study-v1': r });
      eq(M(R, B).result.keys['km-study-v1'].days[day]['fjzk-zh-progress-v1'], 2100, '再导入一次仍是 35 分钟');
      eq(M(R, pk('A', A.keys)).result.keys['km-study-v1'].days[day]['fjzk-zh-progress-v1'], 2100, '导入自己以前的文件不翻倍');
    });

    await test('小狗', () => {
      const shop = P.ITEMS.find(x => x.id === 'collar').price + P.ITEMS.find(x => x.id === 'party').price;   // 5 + 8
      const A = pk('A', { 'km-pet-v1': { breed: 'shiba', name: '旺财', born: 1000, tick: NOW - 10 * 3600000, fullness: 80, xp: 3, bones: 3 * 3 - 2 - 5,
        claimed: { 'fjzk-zh-progress-v1': ['x', 'y'], 'mathmap-progress-v1': ['m'] }, owned: ['collar'], equip: { neck: 'collar' }, spent: { A: 2 }, legacy: { A: 0 }, petDay: '2026-10-9', petCount: 3, lastStudy: 50 } },
        { 'km-pet-v1': { '*': { t: 900 } } });
      const B = pk('B', { 'km-pet-v1': { breed: 'husky', name: '二哈', born: 2000, tick: NOW, fullness: 40, xp: 2, bones: 3 * 2 - 1 - 8,
        claimed: { 'fjzk-zh-progress-v1': ['x', 'z'] }, owned: ['party'], equip: { head: 'party' }, equipT: 5, spent: { B: 1 }, legacy: {}, petDay: '2026-10-16', petCount: 1, lastStudy: 80 } },
        { 'km-pet-v1': { '*': { t: 800 } } });
      B.keys['km-pet-v1'].bones = Math.max(0, B.keys['km-pet-v1'].bones);   // 6−1−8 < 0 → 0（B 的数据本身就是“负数”时公式也不出负）
      const r = law('小狗', A, B).keys['km-pet-v1'];
      eq(r.claimed, { 'fjzk-zh-progress-v1': ['x', 'y', 'z'], 'mathmap-progress-v1': ['m'] }, '验收 6：同一个知识点 x 两边都领过，只算一次');
      eq(r.xp, 4, 'xp = 已领知识点并集个数');
      eq(r.bones, Math.max(0, 3 * 4 - (2 + 1) - 0 - shop), 'bones = 3×xp − Σspent − Σlegacy − 已购装扮总价');
      ok(r.bones >= 0, '骨头不为负');
      eq([r.name, r.breed], ['旺财', 'shiba'], '名字、品种取最早领养的那只（born 最小）');
      eq(r.owned, ['collar', 'party'], '装扮取并集');
      eq(r.equip, { head: 'party' }, '穿戴取 equipT（换装时间）较新的');
      eq([r.born, r.tick, r.fullness], [1000, NOW - 10 * 3600000, 80], 'born 取早；饱食度按同一时刻折算后取更饱的那份（A 折算到 B 的 tick 是 70 > 40）');
      eq([r.petDay, r.petCount, r.lastStudy], ['2026-10-16', 1, 80], 'petDay 取较晚的那天，lastStudy 取大');
      const rep = M(A, B).report.items.find(x => x.key === 'km-pet-v1');
      ok(rep && /两只小狗合并为「旺财」/.test(rep.text), '报告写明两只小狗合并：' + (rep && rep.text));
      // 同一只狗（换平板恢复）：不重复发骨头
      const R = pk('B', { 'km-pet-v1': JSON.parse(JSON.stringify(A.keys['km-pet-v1'])) });
      eq(M(A, R).result.keys['km-pet-v1'].bones, A.keys['km-pet-v1'].bones, '同一只狗合并两次骨头不变');
      // 只一边有小狗：按公式重算，迁移前的老数据（没有 spent/legacy）骨头数不变
      const old = pk('C', { 'km-pet-v1': { breed: 'shiba', name: '小柴', born: 1, tick: NOW, fullness: 50, xp: 5, bones: 4, claimed: { 'fjzk-en-progress-v1': ['a', 'b', 'c', 'd', 'e'] }, owned: ['collar'], equip: {} } });
      const r2 = M(pk('D', {}), old).result.keys['km-pet-v1'];
      eq(r2.bones, 4, '老小狗（没有花费记录）导入到空设备：骨头数不变');
      eq(r2.legacy, { C: 15 - 4 - 5 }, 'legacy = 3×已领 − 当前骨头 − 已购装扮');
    });

    await test('三只狗：任意顺序合并名字一样，改名不丢', () => {
      const dog = (dev, born, name) => pk(dev, { 'km-pet-v1': { breed: born === 300 ? 'shiba' : 'husky', name, born, tick: born, fullness: 50, xp: 0, bones: 0, claimed: {}, owned: [], equip: {}, spent: {}, legacy: {}, nameT: born } });
      const a = dog('A', 500, '阿黄'), b = dog('B', 300, '小柴'), c = dog('C', 900, '二哈');
      const orders = [[a, b, c], [a, c, b], [b, a, c], [b, c, a], [c, a, b], [c, b, a]];
      const pets = orders.map(o => { const r1 = M(o[0], o[1]).result; return M(pk('X', r1.keys, r1.meta), o[2]).result.keys['km-pet-v1']; });
      eq(pets.map(p => p.name + '/' + p.breed), Array(6).fill('小柴/shiba'), '验收：6 种顺序都是最早领养的「小柴」');
      eq(pets.map(p => canon(p)), Array(6).fill(canon(pets[0])), '6 种顺序得到完全相同的小狗');
      // 合并后在设备 C 上改名（同一只狗，nameT 更新）；设备 B 后来喂了狗（整键修改时间更晚）。再和 A 合并
      const m0 = pets[0];
      const renamed = pk('C', { 'km-pet-v1': Object.assign({}, m0, { name: '豆豆', nameT: 99999 }) }, { 'km-pet-v1': { '*': { t: 99999, by: 'C' } } });
      const fed = pk('B', { 'km-pet-v1': Object.assign({}, m0, { tick: 200000, fullness: 90 }) }, { 'km-pet-v1': { '*': { t: 200000, by: 'B' } } });
      const fr = M(fed, renamed).result;
      const back = M(pk('Y', fr.keys, fr.meta), a).result.keys['km-pet-v1'];
      eq(back.name, '豆豆', '验收：改名以后再合并，新名字不丢（不会被别的设备喂狗盖掉）');
    });

    await test('随机三方：三种合并顺序结果完全相同', () => {
      let seed = +new URLSearchParams(location.search).get('seed') || 20261016;   // 可以在网址后加 ?seed=数字 换一批随机数据
      const rnd = n => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % n; };
      const pickOne = arr => arr[rnd(arr.length)];
      const devs = ['A', 'B', 'C'];
      function gen(dev) {
        const keys = {}, meta = {};
        const put = (k, id, e) => { (meta[k] = meta[k] || {})[id] = e; };
        // 进度 / 数学进度 / 错题：每条随机是“有 / 删了 / 没有”
        [['fjzk-zh-progress-v1', () => ({ viewed: rnd(50), best: pickOne([null, rnd(100)]), last: pickOne([null, rnd(100)]), attempts: rnd(5), updated: rnd(30), ...(rnd(2) ? { diag: pickOne(['pass', 'fail']), diagInferred: !!rnd(2), diagAt: rnd(30) } : {}) })],
         ['mathmap-progress-v1', () => ({ best: rnd(10) / 10, last: rnd(10) / 10, at: rnd(30) })],
         ['mathmap-wrong-v1', () => ({ n: 1 + rnd(4), at: rnd(40) })]].forEach(([k, mk]) => {
          const o = {};
          ['i1', 'i2', 'i3', 'i4'].forEach(id => {
            const s = rnd(3);
            if (s === 0) { o[id] = mk(); if (rnd(2)) put(k, id, { t: 10 + rnd(50), by: dev, ...(rnd(3) ? {} : { x: rnd(10) }) }); }

      localStorage.setItem('fjzk-zh-progress-v1', JSON.stringify({ a: { last: 50, best: 50 } }));
      D._flush();
      const snap = JSON.stringify(Object.assign({}, localStorage));
      D.merge(D.collect(), D.parseFile(JSON.stringify({ app: 'fjzk-chinese-map', progress: { a: { last: 90, best: 90, updated: 9e12 } } })).pkg);
      D._flush();
      eq(JSON.stringify(Object.assign({}, localStorage)), snap, '验收 11：只预览（merge）不写任何存储');
    });

    await test('App 里两个存储空间互通（模拟 KMBridge.sharedGet/sharedPut）', async () => {
      resetLS();
      const store = {};
      const bridge = {
        sharedGet: k => store[k] ? JSON.stringify(store[k]) : '',
        sharedPut: (k, json, t) => { store[k] = { v: json, t }; return true; },
        deviceName: () => 'Xiaomi Pad', saveFile: () => {}
      };
      // 在同源 iframe 里装一份带模拟原生桥的 km-data.js（相当于听写页）
      async function frame() {
        const f = document.createElement('iframe');
        f.style.display = 'none';
        document.body.appendChild(f);
        f.contentWindow.KMBridge = bridge;
        await new Promise((ok, bad) => { const s = f.contentDocument.createElement('script'); s.src = new URL('../km-data.js', location.href).href; s.onload = ok; s.onerror = bad; f.contentDocument.head.appendChild(s); });
        return f;
      }
      const K = 'fjzk-en-dictation-v1';
      // 1. 听写页新建词单 → 写进共享存储
      let f = await frame();
      const dev = f.contentWindow.KMData.device();
      eq(JSON.parse(JSON.parse(store['km-device-v1'].v).value.id ? store['km-device-v1'].v : '{}').value.id, dev.id, '设备编号存进共享存储（两边同一个编号）');
      f.contentWindow.localStorage.setItem(K, JSON.stringify({ lists: [{ id: 'L9', name: '新词单', words: [{ en: 'dog' }], wrong: {}, history: [], created: 99 }], settings: {} }));
      f.contentWindow.KMData._flush();
      ok(store[K] && JSON.parse(store[K].v).value.lists[0].id === 'L9', '听写页写入后同步到共享存储');
      // 2. 「我的数据」页导出：从共享存储读听写
      const exp = f.contentWindow.KMData.collect();
      ok(exp.keys[K] && exp.keys[K].lists[0].id === 'L9' && exp.meta[K] && exp.meta[K].L9, '验收 14：导出的文件里能看到听写页新建的词单（含修改记录）');
      // 3. 导入后写回共享存储；听写页下次打开时合并进本地
      f.contentWindow.KMData.apply({ keys: { [K]: { lists: [{ id: 'L9', name: '新词单', words: [{ en: 'dog' }], wrong: {}, history: [], created: 99 }, { id: 'L5', name: '导入的', words: [], wrong: {}, history: [], created: 50 }], settings: {} } }, meta: { [K]: { L5: { t: 5 } } } });
      ok(JSON.parse(store[K].v).value.lists.length === 2, '导入写回共享存储');
      f.remove();
      f = await frame();      // 重新打开听写页
      eq(JSON.parse(localStorage.getItem(K)).lists.map(l => l.id), ['L9', 'L5'], '听写页打开时把共享存储里的词单合并进本地');
      f.remove();
    });
  } finally {
    localStorage.clear();
    Object.keys(saved).forEach(k => localStorage.setItem(k, saved[k]));
    D._flush();
    localStorage.clear();
    Object.keys(saved).forEach(k => Storage.prototype.setItem.call(localStorage, k, saved[k]));
    D._flush();
  }
  document.getElementById('sum').innerHTML = res.fail ? `<span class="bad">${res.fail} 项失败</span>，${res.pass} 项通过` : `<span class="ok">全部 ${res.pass} 项通过</span>`;
  res.done = true;
})();
</script>
