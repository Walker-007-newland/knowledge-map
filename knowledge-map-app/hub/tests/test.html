<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>km-data 单元测试</title>
<style>
  :root { --bg: #f6f4ef; --text: #1f2328; --good: #2f8a4c; --bad: #c23f2e; --muted: #6b6f76; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17181b; --text: #e8e6e1; --good: #5cbf7a; --bad: #ef7a68; --muted: #9a9ca3; } }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--text); font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #sum { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .ok { color: var(--good); } .bad { color: var(--bad); }
  li { margin: 2px 0; } small { color: var(--muted); }
</style>
</head>
<body>
<h1>km-data.js 合并引擎单元测试</h1>
<p><small>用法：用本地服务器打开本页（如 http://localhost:8781/issue-2/knowledge-map-app/hub/tests/test.html）。会临时清空本页所在网址的 localStorage，跑完自动还原。结果也在 window.__results。<br>网址后加 <code>?seed=数字</code> 换一批随机数据；加 <code>?seeds=1-200</code>（或 <code>?seeds=1,5,9</code>）只批量跑随机三方类用例和删除记录穷举，汇总失败的 seed（失败的 seed 也在 window.__results.failedSeeds）。</small></p>
<div id="sum">运行中…</div>
<ol id="out"></ol>
<script src="../km-data.js"></script>
<script src="../km-study.js"></script>
<script src="../pet/pet-core.js"></script>
<script>
(async function () {
  const D = KMData, P = KMPet, S = KMStudy;
  const out = document.getElementById('out');
  const res = { pass: 0, fail: 0, failures: [] };
  window.__results = res;
  const canon = D._canon;
  let cur = '';
  function log(ok, msg) {
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'bad';
    li.textContent = (ok ? '✓ ' : '✗ ') + cur + '：' + msg;
    out.appendChild(li);
    if (ok) res.pass++; else { res.fail++; res.failures.push(cur + '：' + msg); }
  }
  function eq(a, b, msg) { const ok = canon(a) === canon(b); log(ok, msg + (ok ? '' : '　实际 ' + canon(a) + '　期望 ' + canon(b))); }
  function ok(v, msg) { log(!!v, msg); }
  const NOW = Date.UTC(2026, 9, 20, 8, 0, 0);
  const pk = (dev, keys, meta) => ({ device: { id: dev, name: dev }, keys: keys || {}, meta: meta || {} });
  const M = (a, b) => D.merge(a, b, { now: NOW });
  // 对称 + 幂等：A 合 B = B 合 A；结果再合 A、再合 B 都不变
  function law(name, A, B, C) {
    const ab = M(A, B).result, ba = M(B, A).result;
    if (C) {
      const r1 = M(pk('X', ab.keys, ab.meta), C).result, bc = M(B, C).result, r2 = M(A, pk('Y', bc.keys, bc.meta)).result;
      eq(r1, r2, name + ' 结合律：(A合B)合C = A合(B合C)');
    }
    eq(ab.keys, ba.keys, name + ' 对称（keys）');
    eq(ab.meta, ba.meta, name + ' 对称（meta）');
    const R = pk('R', ab.keys, ab.meta);
    eq(M(R, B).result.keys, ab.keys, name + ' 幂等（结果再合 B 不变）');
    eq(M(R, A).result.keys, ab.keys, name + ' 幂等（结果再合 A 不变）');
    ok(!M(R, B).report.changed, name + ' 再导入一次报告“没有变化”');
    return ab;
  }
  async function test(name, fn) { cur = name; try { await fn(); } catch (e) { log(false, '抛出异常 ' + (e && e.stack || e)); } }

  // 备份本页 localStorage，测试完还原
  const saved = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); saved[k] = localStorage.getItem(k); }
  function resetLS() { localStorage.clear(); }

  // 随机三方（#2）：200 组随机三份数据，四种合并顺序 + 再合 a。返回 { bad, first }；?seeds= 批量模式也跑它
  function rand3(seed0) {
    let seed = seed0;
    const rnd = n => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % n; };
    const pickOne = arr => arr[rnd(arr.length)];
    const devs = ['A', 'B', 'C'];
    function gen(dev) {
      const keys = {}, meta = {};
      const put = (k, id, e) => { (meta[k] = meta[k] || {})[id] = e; };
      // 进度 / 数学进度 / 错题：每条随机是“有 / 删了 / 没有”
      [['fjzk-zh-progress-v1', () => ({ viewed: rnd(50), best: pickOne([null, rnd(100)]), last: pickOne([null, rnd(100)]), attempts: rnd(5), updated: rnd(30), ...(rnd(2) ? { diag: pickOne(['pass', 'fail']), diagInferred: !!rnd(2), diagAt: rnd(30) } : {}) })],
       ['mathmap-progress-v1', () => ({ best: rnd(10) / 10, last: rnd(10) / 10, at: rnd(30) })],
       ['mathmap-wrong-v1', () => ({ n: 1 + rnd(4), at: rnd(40) })]].forEach(([k, mk]) => {
        const o = {};
        ['i1', 'i2', 'i3', 'i4'].forEach(id => {
          const s = rnd(3);
          if (s === 0) { o[id] = mk(); if (rnd(2)) put(k, id, { t: 10 + rnd(50), by: dev, ...(rnd(3) ? {} : { x: rnd(10) }) }); }
          else if (s === 1) put(k, id, { t: rnd(10), by: dev, x: 20 + rnd(50), v: mk() });
        });
        keys[k] = o;
      });
      // 草稿：要么老数据（没有版本），要么有各设备版本
      const dr = {}, dm = {};
      ['w1', 'w2'].forEach(id => {
        if (!rnd(3)) return;
        if (rnd(2)) { dr[id] = { 0: { text: pickOne(['', '甲', '甲乙', '丙']) } }; return; }
        const vers = { 0: {} };
        devs.forEach(d => { if (d === dev || rnd(2)) vers[0][d] = { t: rnd(20), text: pickOne(['', '甲', '甲乙', '丙', '丁']), seen: rnd(2) ? { [pickOne(devs)]: rnd(20) } : {} }; });
        dm[id] = { t: rnd(30), by: dev, vers };
        dr[id] = { 0: { text: D.computeDraft(vers[0]).text } };
      });
      keys['fjzk-zh-drafts-v1'] = dr; meta['fjzk-zh-drafts-v1'] = dm;
      if (rnd(2)) { keys['fjzk-zh-diag-v1'] = { s: rnd(5) }; put('fjzk-zh-diag-v1', '*', { t: rnd(5), by: dev }); }
      if (rnd(2)) keys['km-narrate-rate'] = pickOne(['0.8', '1', '1.2']);
      if (rnd(2)) keys['fjzk-x-v1'] = { r: rnd(5) };
      keys['km-study-v1'] = rnd(2) ? { days: { d1: { k: rnd(100) } }, first: { k: { a: 'd' + rnd(9) } }, totals: { k: rnd(9) } }
        : { days: {}, byDev: { [dev]: { d1: { k: rnd(100) } }, [pickOne(devs)]: { d2: { k: rnd(100) } } }, first: {}, totals: {}, migrated: 1 };
      if (rnd(4)) keys['km-pet-v1'] = { breed: pickOne(['shiba', 'husky']), name: pickOne(['甲', '乙', '丙']), born: rnd(3), nameT: rnd(5), tick: rnd(1e6), fullness: rnd(100), xp: rnd(7), bones: rnd(20),
        claimed: { k: ['a', 'b', 'c', 'd'].filter(() => rnd(2)) }, owned: ['collar', 'party'].filter(() => rnd(2)), equip: { neck: pickOne(['collar', null]) }, equipT: rnd(5),
        ...(rnd(2) ? { spent: { [dev]: rnd(5) }, legacy: { [dev]: rnd(5) } } : {}), petDay: '2026-10-' + (1 + rnd(9)), petCount: rnd(4), lastStudy: rnd(9) };
      const lists = [];
      ['L1', 'L2'].forEach(id => {
        const s = rnd(3);
        const mk = () => ({ id, name: pickOne(['一', '二']), words: [{ en: pickOne(['cat', 'dog']) }], wrong: { cat: rnd(3) }, history: [{ at: rnd(5), c: rnd(2) }], created: rnd(3) });
        if (s === 0) { lists.push(mk()); if (rnd(2)) put('fjzk-en-dictation-v1', id, { t: 10 + rnd(20), by: dev }); }
        else if (s === 1) put('fjzk-en-dictation-v1', id, { t: rnd(5), x: 10 + rnd(30), v: mk() });
      });
      keys['fjzk-en-dictation-v1'] = { lists, settings: { reps: String(rnd(3)) } };
      put('fjzk-en-dictation-v1', '@settings', { t: rnd(5), by: dev });
      return pk(dev, keys, meta);
    }
    const P2 = r => pk('R', r.keys, r.meta);
    let bad = 0, first = '';
    for (let i = 0; i < 200; i++) {
      const a = gen('A'), b = gen('B'), c = gen('C');
      const r1 = M(P2(M(a, b).result), c).result;
      const r2 = M(a, P2(M(b, c).result)).result;
      const r3 = M(P2(M(a, c).result), b).result;
      const r4 = M(P2(M(c, b).result), a).result;
      const s1 = JSON.stringify(r1);
      if (s1 !== JSON.stringify(r2) || s1 !== JSON.stringify(r3) || s1 !== JSON.stringify(r4)) { bad++; if (!first) first = '第 ' + i + ' 组：' + s1.slice(0, 300) + ' ≠ ' + JSON.stringify(r2).slice(0, 300); }
      if (JSON.stringify(M(P2(r1), a).result) !== s1) { bad++; if (!first) first = '第 ' + i + ' 组再合 a 变了'; }
    }
    return { bad, first };
  }
  // 等级不倒退（#7）的随机部分：150 组含 claimed 重复、xp 比去重数大的小狗
  function randPet(seed0) {
    const Z = 'fjzk-zh-progress-v1';
    let seed = seed0 + 7;
    const rnd = n => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % n; };
    const pickOne = arr => arr[rnd(arr.length)];
    function gen(dev) {
      const keys = {}, meta = {};
      keys[Z] = {};
      ['a', 'b', 'c'].forEach(id => { if (rnd(2)) { keys[Z][id] = { last: rnd(100), best: rnd(100), updated: rnd(9) }; if (rnd(2)) (meta[Z] = meta[Z] || {})[id] = { t: rnd(20), by: dev }; } });
      if (rnd(2)) keys['km-narrate-rate'] = pickOne(['0.8', '1', '1.2']);
      if (rnd(2)) keys['km-study-v1'] = { days: { d1: { k: rnd(100) } }, first: {}, totals: {} };
      if (rnd(5)) {
        const cl = ['a', 'b', 'c', 'd', 'e'].filter(() => rnd(2));
        const dup = rnd(3) ? cl.concat(cl.slice(0, 1 + rnd(3))) : cl;
        keys['km-pet-v1'] = { breed: pickOne(['shiba', 'husky']), name: pickOne(['甲', '乙']), born: rnd(3), tick: rnd(1e6), fullness: rnd(100),
          xp: new Set(cl).size + rnd(4), bones: rnd(15), claimed: { [Z]: dup, k: ['p', 'q'].filter(() => rnd(2)) }, owned: ['collar', 'party'].filter(() => rnd(2)),
          equip: rnd(2) ? { neck: 'collar' } : {}, ...(rnd(2) ? { equipT: rnd(5) } : {}), ...(rnd(2) ? { spent: { [dev]: rnd(5) }, legacy: { [dev]: rnd(5) } } : {}),
          petDay: '2026-10-' + (1 + rnd(9)), petCount: rnd(4), lastStudy: rnd(9) };
      }
      return pk(dev, keys, meta);
    }
    const P2 = r => pk('R', r.keys, r.meta);
    const xpOf = p => { const v = p.keys['km-pet-v1']; return v && v.breed ? +v.xp || 0 : 0; };
    let bad = 0, first = '';
    const fail = m => { bad++; if (!first) first = m; };
    for (let i = 0; i < 150; i++) {
      const a = gen('A'), b = gen('B'), c = gen('C');
      const orders = [[a, b, c], [a, c, b], [b, a, c], [b, c, a], [c, a, b], [c, b, a]];
      const rs = orders.map(o => M(P2(M(o[0], o[1]).result), o[2]).result);
      const s0 = JSON.stringify(rs[0]);
      if (rs.some(r => JSON.stringify(r) !== s0)) fail('第 ' + i + ' 组：6 种顺序结果不同');
      if (JSON.stringify(M(a, P2(M(b, c).result)).result) !== s0) fail('第 ' + i + ' 组：a,(b,c) 结果不同');
      if (JSON.stringify(M(P2(rs[0]), a).result) !== s0 || JSON.stringify(M(P2(rs[0]), P2(rs[0])).result) !== s0) fail('第 ' + i + ' 组：合并再合并变了');
      const pet = rs[0].keys['km-pet-v1'];
      if (pet) {
        if (!(pet.xp >= xpOf(a) && pet.xp >= xpOf(b) && pet.xp >= xpOf(c))) fail('第 ' + i + ' 组：xp ' + pet.xp + ' 小于某一边');
        if (pet.xp < D.uniqClaimed(pet)) fail('第 ' + i + ' 组：xp 小于去重数');
        if (pet.bones !== D.petBones(pet)) fail('第 ' + i + ' 组：骨头 ' + pet.bones + ' ≠ 公式 ' + D.petBones(pet));
      }
      [a, c].forEach(x => { const r2 = M(x, b).result.keys['km-pet-v1']; if (r2 && P.level(r2.xp) < P.level(xpOf(x))) fail('第 ' + i + ' 组：导入后等级低于导入前'); });
    }
    return { bad, first };
  }
  const SEED = +new URLSearchParams(location.search).get('seed') || 20261016;   // 可以在网址后加 ?seed=数字 换一批随机数据

  // 删除记录（墓碑）× 各种条目的穷举（#8）：每种按条目合并的键（错题、数学进度、进度、草稿、听写词单）
  // 每一边取下面 10 种状态之一，三边所有组合 × 6 种顺序 + a,(b,c) 逐字节相同，结果再合任一边 / 自己不变。返回 { bad, first, n }
  const TOMB_KINDS = [
    ['mathmap-wrong-v1', at => ({ n: 1 + at % 3, at })],
    ['mathmap-progress-v1', at => ({ best: 0.5, last: (at % 10) / 10, at })],
    ['fjzk-zh-progress-v1', at => ({ viewed: at, best: 50 + at % 7, last: 50, attempts: 1, updated: at })],
    ['fjzk-zh-drafts-v1', at => ({ 0: { text: '作文' + at } })],
    ['fjzk-en-dictation-v1', at => ({ id: 'L1', name: '单元' + at % 2, words: [{ en: 'cat' }], wrong: { cat: at % 3 }, history: [{ at, c: 1 }], created: 1 })]
  ];
  // 状态：[说明, 条目内容的时间 at 或 null（这一边没有这一条）, 这一条的修改记录或 null]
  const TOMB_STATES = [
    ['没有', null, null],
    ['旧条目 at 8（无修改记录）', 8, null],
    ['旧条目 at 40（无修改记录）', 40, null],
    ['新条目 t 40', 40, d => ({ t: 40, by: d })],
    ['新条目 t 20', 20, d => ({ t: 20, by: d })],
    ['墓碑 x 30', null, (d, mk) => ({ t: 5, by: d, x: 30, v: mk(10) })],
    ['墓碑 x 30、删除前内容 at 32（时钟不准）', null, (d, mk) => ({ t: 0, x: 30, v: mk(32) })],
    ['墓碑 x 30、t 50（时钟不准）', null, (d, mk) => ({ t: 50, by: d, x: 30, v: mk(10) })],
    ['墓碑 x 8（与旧条目同一时刻）', null, (d, mk) => ({ x: 8, v: mk(8) })],
    ['只有修改记录 t 12、没有条目', null, d => ({ t: 12, by: d })]
  ];
  function tombSide(key, mk, s, dev) {
    const [, at, me] = TOMB_STATES[s];
    const keys = {}, meta = {};
    const isList = key === 'fjzk-en-dictation-v1';
    keys[key] = isList ? { lists: [] } : {};
    if (at !== null) { if (isList) keys[key].lists.push(mk(at)); else keys[key].w1 = mk(at); }
    if (me) meta[key] = { [isList ? 'L1' : 'w1']: me(dev, mk) };
    return pk(dev, keys, meta);
  }
  function tombCombos() {
    const P2 = r => pk('R', r.keys, r.meta);
    const S1 = r => JSON.stringify(r);
    let bad = 0, first = '', n = 0;
    TOMB_KINDS.forEach(([key, mk]) => {
      const N = TOMB_STATES.length;
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) for (let k = 0; k < N; k++) {
        n++;
        const a = tombSide(key, mk, i, 'A'), b = tombSide(key, mk, j, 'B'), c = tombSide(key, mk, k, 'C');
        const orders = [[a, b, c], [a, c, b], [b, a, c], [b, c, a], [c, a, b], [c, b, a]];
        const rs = orders.map(o => S1(M(P2(M(o[0], o[1]).result), o[2]).result));
        const r0 = JSON.parse(rs[0]);
        const why = rs.some(s => s !== rs[0]) ? '6 种顺序结果不同'
          : S1(M(a, P2(M(b, c).result)).result) !== rs[0] ? 'a,(b,c) 结果不同'
          : [a, b, c, P2(r0)].some(x => S1(M(P2(r0), x).result) !== rs[0]) ? '结果再合并变了'
          : M(P2(r0), a).report.changed ? '结果再导入报告有变化' : '';
        if (why) { bad++; if (!first) first = key + '：' + [i, j, k].map(s => TOMB_STATES[s][0]).join(' × ') + ' → ' + why; }
      }
    });
    return { bad, first, n };
  }

  // 批量模式：?seeds=1-200（或 ?seeds=1,5,9）只跑随机三方类用例，汇总失败的 seed
  const seedsArg = new URLSearchParams(location.search).get('seeds');
  if (seedsArg) {
    const seeds = [];
    seedsArg.split(',').forEach(part => {
      const m = /^\s*(\d+)\s*(?:-\s*(\d+))?\s*$/.exec(part);
      if (!m) return;
      const lo = +m[1], hi = m[2] ? +m[2] : lo;
      for (let s = Math.min(lo, hi); s <= Math.max(lo, hi); s++) seeds.push(s);
    });
    const sum = document.getElementById('sum');
    const bySeed = [];
    const t0 = Date.now();
    cur = '删除记录穷举（#8）';
    const tc = tombCombos();
    log(!tc.bad, tc.n + ' 种三方组合 × 6 种顺序逐字节相同' + (tc.bad ? '；失败 ' + tc.bad + ' 次，' + tc.first : ''));
    for (const s of seeds) {
      sum.textContent = '批量运行中… seed ' + s + '（' + (seeds.indexOf(s) + 1) + ' / ' + seeds.length + '）';
      await new Promise(r => setTimeout(r, 0));
      const r1 = rand3(s), r2 = randPet(s);
      const msgs = [];
      if (r1.bad) msgs.push('随机三方：失败 ' + r1.bad + ' 次，' + r1.first);
      if (r2.bad) msgs.push('等级不倒退随机：失败 ' + r2.bad + ' 次，' + r2.first);
      cur = 'seed ' + s;
      if (msgs.length) { bySeed.push(s); log(false, msgs.join('；')); } else res.pass++;
    }
    res.failedSeeds = bySeed;
    res.seeds = seeds.length;
    sum.innerHTML = (bySeed.length || tc.bad)
      ? `<span class="bad">批量 ${seeds.length} 个 seed：${bySeed.length} 个失败</span>（${bySeed.join('、') || '无'}）${tc.bad ? '；删除记录穷举失败' : ''}`
      : `<span class="ok">批量 ${seeds.length} 个 seed 全部通过</span>（随机三方 + 等级不倒退随机，另加删除记录穷举 ${tc.n} 组）`;
    sum.innerHTML += ` <small>用时 ${Math.round((Date.now() - t0) / 1000)} 秒</small>`;
    res.done = true;
    return;
  }

  try {
    await test('进度（非数学）', () => {
      const A = pk('A', { 'fjzk-zh-progress-v1': { n1: { viewed: 100, best: 90, last: 60, attempts: 3, updated: 2000 } } });
      const B = pk('B', { 'fjzk-zh-progress-v1': { n1: { viewed: 50, best: 70, last: 85, attempts: 2, updated: 1000 }, n2: { viewed: 10, last: null, best: null, attempts: 0 } } });
      const r = law('进度', A, B).keys['fjzk-zh-progress-v1'];
      eq(r.n1, { viewed: 50, best: 90, last: 60, attempts: 3, updated: 2000 }, '验收 5：best=90、last=60（最近一次为准，最好成绩不降），viewed 取早、attempts 取大');
      eq(r.n2, { viewed: 10, last: null, best: null, attempts: 0 }, '只一边有的知识点保留');
      const C = pk('C', { 'fjzk-zh-progress-v1': { n1: { viewed: 5, diag: 'pass', diagInferred: true, diagAt: 3000 } } });
      const E = pk('E', { 'fjzk-zh-progress-v1': { n1: { viewed: 9, diag: 'fail', diagInferred: false, diagAt: 4000 } } });
      eq(law('诊断', C, E).keys['fjzk-zh-progress-v1'].n1, { viewed: 5, diag: 'fail', diagInferred: false, diagAt: 4000 }, 'diag 三项一起取 diagAt 新的');
      const rep = M(B, A).report;
      ok(rep.items.some(x => x.key === 'fjzk-zh-progress-v1' && /1 个最好成绩提高/.test(x.text)), '报告写明最好成绩提高：' + rep.items.map(x => x.name + x.text).join(' / '));
    });

    await test('数学进度', () => {
      const A = pk('A', { 'mathmap-progress-v1': { m1: { best: 0.9, last: 0.5, at: 3000 }, m2: { best: 0.4, last: 0.4, at: 1 } } });
      const B = pk('B', { 'mathmap-progress-v1': { m1: { best: 0.7, last: 0.7, at: 1000 }, m3: { best: 1, last: 1, at: 5 } } });
      const r = law('数学进度', A, B).keys['mathmap-progress-v1'];
      eq(r.m1, { best: 0.9, last: 0.5, at: 3000 }, 'best 取大，last+at 取 at 新的');

      eq(M(E, F).result, M(F, E).result, '只一边有：对称');
      const pet = M(E, F).result.keys['km-pet-v1'];
      eq([pet.claimed, pet.owned, pet.xp], [{ 'fjzk-zh-progress-v1': ['a', 'b', 'z'], 'mathmap-progress-v1': ['m1', 'm2'] }, ['collar', 'party'], 5], '只一边有小狗：claimed 每科、owned 去重排序，xp = max(去重后个数 5, 原 xp 4)');
      eq(M(E, F).result.keys['fjzk-en-dictation-v1'].lists[0].history.map(h => h.at), [10, 30], '只一边有词单：history 去重排序');
      // 1. 新设备导入后再导入同一个文件
      const R1 = M(E, F).result;
      const r2 = M(pk('N', R1.keys, R1.meta), F).report;
      ok(!r2.changed, '验收 4：新设备导入一次后再导入同一文件 → 没有变化：' + r2.items.map(x => x.name + x.text).join(' / '));
      // 2. 导入自己刚导出的文件（本机数据就是未排序的）
      const r3 = M(F, JSON.parse(JSON.stringify(F))).report;
      ok(!r3.changed, '导入自己刚导出的文件 → 没有变化：' + r3.items.map(x => x.name + x.text).join(' / '));
      // 3. 只有一边有小狗、另一边有别的数据
      const G = pk('B', { 'fjzk-zh-progress-v1': { c: { viewed: 2, last: 80, best: 80, attempts: 1, updated: 6 } } });
      const R4 = M(G, F).result;
      ok(!M(pk('B', R4.keys, R4.meta), F).report.changed, '只一边有小狗：合并后再导入小狗那边的文件 → 没有变化');
      ok(!M(pk('B', R4.keys, R4.meta), G).report.changed, '只一边有小狗：合并后再导入另一边的文件 → 没有变化');
      // 报告文字：说清改了什么；类别总数
      const F2 = JSON.parse(JSON.stringify(F));
      F2.keys['km-pet-v1'].claimed['fjzk-zh-progress-v1'].push('c', 'd', 'e');
      const it = M(F, F2).report.items.find(x => x.key === 'km-pet-v1');
      ok(it && /已领知识点 \+3（共 8 个）/.test(it.text), '小狗变化写明「已领知识点 +3」：' + (it && it.text));
      const rp = M(E, F).report;
      eq([rp.items.length, rp.total], [4, 4], '报告给出类别总数（全部有变化时页面不写「其余没有变化」）');
      const F3 = JSON.parse(JSON.stringify(F));
      F3.keys['fjzk-zh-progress-v1'].b.viewed = 0;
      const it3 = M(F, F3).report.items.find(x => x.key === 'fjzk-zh-progress-v1');
      ok(it3 && /1 个知识点的最近成绩、浏览时间等有更新/.test(it3.text), '进度只改了浏览时间：不写含糊的「已更新」：' + (it3 && it3.text));
    });

    await test('设备编号', () => {
      resetLS();
      const d = D.device();
      ok(/^[0-9a-f]{16}$/.test(d.id) && d.name === '浏览器', '16 位编号，浏览器里名称为「浏览器」');
      eq(JSON.parse(localStorage.getItem('km-device-v1')).id, d.id, '存在 km-device-v1');
    });

    await test('升级迁移：小狗骨头不变、学习时长不变', () => {
      resetLS();
      const me = D.device().id;
      // 升级前的老数据：领过 6 个知识点（18 根），买了项圈（5），喂过 4 次 → 剩 9 根
      localStorage.setItem('fjzk-zh-progress-v1', JSON.stringify({ a: { last: 90 }, b: { last: 90 }, c: { last: 90 }, d: { last: 90 }, e: { last: 90 }, f: { last: 90 }, g: { last: 95 } }));
      const old = { breed: 'shiba', name: '小柴', born: 1, tick: Date.now(), fullness: 50, xp: 6, bones: 9, claimed: { 'fjzk-zh-progress-v1': ['a', 'b', 'c', 'd', 'e', 'f'] }, owned: ['collar'], equip: { neck: 'collar' }, petDay: '', petCount: 0, lastStudy: 0 };
      localStorage.setItem('km-pet-v1', JSON.stringify(old));
      localStorage.setItem('km-study-v1', JSON.stringify({ days: { '2026-10-15': { 'fjzk-zh-progress-v1': 1234.5 } }, first: {}, totals: {} }));
      const st = P.load();
      eq(st.bones, 9, '验收 13：迁移后骨头仍是 9');
      eq(JSON.parse(localStorage.getItem('km-pet-v1-backup')), old, '迁移前原数据备份到 km-pet-v1-backup');
      eq(st.legacy, { [me]: 18 - 9 - 5 }, 'legacy[本机] = 3×已领 − 骨头 − 装扮');
      eq(D.petBones(st), st.bones, '恒等式成立');
      P.feed(st);
      eq([st.bones, st.spent[me], D.petBones(st)], [8, 1, 8], '喂食：骨头 −1、spent+1，恒等式成立');
      st.fullness = 10;
      P.buy(st, 'party');
      eq(D.petBones(st), st.bones, '买装扮后恒等式成立');
      P.claim(st);
      eq([st.xp, D.petBones(st) === st.bones], [7, true], '领新掌握的知识点后恒等式成立');
      eq(P.load().legacy, st.legacy, '迁移只做一次');
      const sst = S.load();
      eq([sst.migrated, sst.byDev[me]['2026-10-15']['fjzk-zh-progress-v1'], S.secondsOn(sst, '2026-10-15')], [1, 1234.5, 1234.5], '学习时长迁移：byDev[本机] = 原 days，统计页读的 days 不变');
    });

    await test('降过级的设备打开后等级恢复（#7）', () => {
      resetLS();
      const me = D.device().id, Z = 'fjzk-zh-progress-v1';
      localStorage.setItem(Z, JSON.stringify({ a: { last: 90 }, b: { last: 90 }, c: { last: 90 } }));
      localStorage.setItem('km-study-v1', JSON.stringify({ days: { '2026-10-15': { [Z]: 1234.5 } }, first: {}, totals: {} }));
      // #2 升级时留的备份：claimed 有重复，xp 5（Lv.2），骨头 5
      const orig = { breed: 'shiba', name: '小柴', born: 1, tick: Date.now(), fullness: 50, xp: 5, bones: 5, claimed: { [Z]: ['a', 'b', 'a', 'c', 'b'] }, owned: [], equip: {}, petDay: '', petCount: 0, lastStudy: 0 };
      localStorage.setItem('km-pet-v1-backup', JSON.stringify(orig));
      // #2 上线后做过一次写回的导入：claimed 去重、xp 按去重数变成 3（Lv.1），骨头仍是 5
      const down = Object.assign({}, orig, { xp: 3, claimed: { [Z]: ['a', 'b', 'c'] }, spent: {}, legacy: { [me]: 4 } });
      localStorage.setItem('km-pet-v1', JSON.stringify(down));
      const st = P.load();
      eq([st.xp, P.level(st.xp), st.bones, D.petBones(st)], [5, 2, 5, 5], '验收 3：备份是同一只狗、xp 更大 → 打开后 xp 5、Lv.2，骨头仍是 5');
      eq([st.claimed, st.spent, st.legacy], [down.claimed, down.spent, down.legacy], '修复不碰 claimed、spent、legacy');
      eq(JSON.parse(localStorage.getItem('km-pet-v1')).xp, 5, '恢复后的经验已保存');
      eq(P.load().xp, 5, '再打开不再变（只做一次）');
      eq(S.secondsOn(S.load(), '2026-10-15'), 1234.5, '学习时长不变');
      ok(!P.pending(P.load()).length, '恢复后不会再为已领过的知识点发骨头');
      localStorage.setItem('km-pet-v1', JSON.stringify(Object.assign({}, down, { born: 2 })));
      eq([P.load().xp, P.load().bones], [3, 5], '验收 3：备份 born 不同（不是同一只狗）→ xp 不变');
      localStorage.setItem('km-pet-v1', JSON.stringify(Object.assign({}, down, { xp: 8 })));
      eq(P.load().xp, 8, '当前 xp 已比备份大 → 不动');
      localStorage.removeItem('km-pet-v1-backup');
      localStorage.setItem('km-pet-v1', JSON.stringify(down));
      eq(P.load().xp, 3, '没有备份 → 不动');
    });

    await test('导出 → 空白设备导入 → 一致；再导入一次没有变化', () => {
      resetLS();
      localStorage.setItem('mathmap-progress-v1', JSON.stringify({ m1: { best: 0.9, last: 0.9, at: 5 } }));
      localStorage.setItem('mathmap-wrong-v1', JSON.stringify({ 'm2#0': { n: 2, at: 6 } }));
      localStorage.setItem('fjzk-zh-progress-v1', JSON.stringify({ z1: { viewed: 1, last: 85, best: 85, attempts: 1, updated: 9 } }));
      localStorage.setItem('fjzk-zh-drafts-v1', JSON.stringify({ z1: { 0: { text: '我的作文', checks: [true] } } }));
      localStorage.setItem('fjzk-zh-diag-v1', JSON.stringify({ done: true, scope: ['z1'], state: {} }));
      localStorage.setItem('km-narrate-rate', '1.2');
      localStorage.setItem('fjzk-en-dictation-v1', JSON.stringify({ lists: [{ id: 'L1', name: '一单元', words: [{ en: 'cat' }], wrong: {}, history: [], created: 3 }], settings: { reps: '2' } }));
      localStorage.setItem('km-study-v1', JSON.stringify({ days: { '2026-10-15': { 'fjzk-zh-progress-v1': 600 } }, first: {}, totals: {} }));
      S.load();
      P.adopt('husky', '二哈');
      let st = P.load(); P.claim(st); st = P.load(); P.feed(st);
      D._flush();
      const file = JSON.parse(JSON.stringify(D.collect()));
      ['mathmap-progress-v1', 'mathmap-wrong-v1', 'fjzk-zh-progress-v1', 'fjzk-zh-drafts-v1', 'fjzk-zh-diag-v1', 'km-narrate-rate', 'fjzk-en-dictation-v1', 'km-study-v1', 'km-pet-v1']
        .forEach(k => ok(k in file.keys, '验收 2：导出文件包含 ' + k));
      eq([file.app, file.schema, file.device.id.length], ['km-all', 1, 16], '文件格式 app/schema/device');
      const before = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); before[k] = localStorage.getItem(k); }
      // 空白设备
      resetLS();
      const info = D.parseFile(JSON.stringify(file));
      const r = D.merge(D.collect(), info.pkg);
      ok(r.report.changed, '预览有变化');
      D.apply(r.result);
      ['mathmap-progress-v1', 'mathmap-wrong-v1', 'fjzk-zh-progress-v1', 'fjzk-zh-drafts-v1', 'fjzk-zh-diag-v1', 'km-narrate-rate', 'fjzk-en-dictation-v1'].forEach(k =>
        eq(JSON.parse(localStorage.getItem(k)), JSON.parse(before[k]), '验收 3：' + k + ' 与导出前一致'));
      const p0 = JSON.parse(before['km-pet-v1']), p1 = P.load();
      eq([p1.name, P.level(p1.xp), p1.bones, p1.equip, p1.owned], [p0.name, P.level(p0.xp), p0.bones, p0.equip, p0.owned], '小狗名字、等级、骨头、装扮一致');
      eq(S.secondsOn(S.load(), '2026-10-15'), 600, '学习统计时长一致');
      ok(!P.pending(p1).length, '验收 6：导入后不会再为已领过的知识点发骨头');
      const snapshot = JSON.stringify(Object.keys(localStorage).sort().filter(k => k !== 'km-meta-v1').map(k => [k, localStorage.getItem(k)]));
      const r2 = D.merge(D.collect(), D.parseFile(JSON.stringify(file)).pkg);
      ok(!r2.report.changed, '验收 4：同一个文件再导入，预览“没有变化”：' + r2.report.items.map(x => x.name + x.text).join(' / '));
      D.apply(r2.result);
      const p2 = P.load();
      eq([p2.bones, S.secondsOn(S.load(), '2026-10-15')], [p0.bones, 600], '再导入一次骨头、学习时长不翻倍');
      const after = JSON.stringify(Object.keys(localStorage).sort().filter(k => k !== 'km-meta-v1').map(k => [k, k === 'km-pet-v1' ? JSON.stringify(Object.assign(JSON.parse(localStorage.getItem(k)), { tick: 0, fullness: 0 })) : localStorage.getItem(k)]));
      const snapN = JSON.stringify(JSON.parse(snapshot).map(([k, v]) => [k, k === 'km-pet-v1' ? JSON.stringify(Object.assign(JSON.parse(v), { tick: 0, fullness: 0 })) : v]));
      eq(after, snapN, '再导入一次后所有数据不变（小狗饱食度随时间自然下降除外）');
      // 不认识的键：写回，并在下次导出时带上
      const f2 = JSON.parse(JSON.stringify(file)); f2.keys['fjzk-future-v1'] = { hello: 1 };
      D.apply(D.merge(D.collect(), D.parseFile(JSON.stringify(f2)).pkg).result);
      eq(D.collect().keys['fjzk-future-v1'], { hello: 1 }, '新版本带来的键写回后，再导出也带上');
    });

    await test('取消导入不改数据', () => {
      resetLS();
      localStorage.setItem('fjzk-zh-progress-v1', JSON.stringify({ a: { last: 50, best: 50 } }));
      D._flush();
      const snap = JSON.stringify(Object.assign({}, localStorage));
      D.merge(D.collect(), D.parseFile(JSON.stringify({ app: 'fjzk-chinese-map', progress: { a: { last: 90, best: 90, updated: 9e12 } } })).pkg);
      D._flush();
      eq(JSON.stringify(Object.assign({}, localStorage)), snap, '验收 11：只预览（merge）不写任何存储');
    });

    await test('App 里两个存储空间互通（模拟 KMBridge.sharedGet/sharedPut，带 #5 的每页令牌）', async () => {
      resetLS();
      const store = {};
      // 模拟原生桥：hello() 隔一会儿把令牌送进主页面的 __kmTok（相当于 evaluateJavascript），其余方法第一个参数必须是当前令牌
      function mkBridge(w) {
        let tok = '';
        const chk = t => t && t === tok;
        return {
          hello() { const t = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => (x < 16 ? '0' : '') + x.toString(16)).join(''); setTimeout(() => { tok = t; w.__kmTok(t); }, 20); },
          sharedGet: (t, k) => chk(t) && store[k] ? JSON.stringify(store[k]) : '',
          sharedPut: (t, k, json, ts) => { if (!chk(t)) return false; store[k] = { v: json, t: ts }; return true; },
          deviceName: t => chk(t) ? 'Xiaomi Pad' : '', saveFile: () => {}
        };
      }
      // 在同源 iframe 里装一份带模拟原生桥的 km-shim.js + km-data.js（相当于听写页），等令牌到、对齐完
      async function frame() {
        const f = document.createElement('iframe');
        f.style.display = 'none';
        document.body.appendChild(f);
        const w = f.contentWindow;
        w.__kmShimTest = 1;
        w.KMBridge = mkBridge(w);
        for (const src of ['../km-shim.js', '../km-data.js'])
          await new Promise((ok, bad) => { const s = f.contentDocument.createElement('script'); s.src = new URL(src, location.href).href; s.onload = ok; s.onerror = bad; f.contentDocument.head.appendChild(s); });
        await w.KMData.ready();
        return f;
      }
      const K = 'fjzk-en-dictation-v1';
      // 1. 听写页新建词单 → 写进共享存储
      let f = await frame();
      const dev = f.contentWindow.KMData.device();
      eq(dev.name, 'Xiaomi Pad', '令牌到了以后设备名来自原生桥（KMApp.deviceName 补上令牌）');
      eq(JSON.parse(JSON.parse(store['km-device-v1'].v).value.id ? store['km-device-v1'].v : '{}').value.id, dev.id, '设备编号存进共享存储（两边同一个编号）');
      f.contentWindow.localStorage.setItem(K, JSON.stringify({ lists: [{ id: 'L9', name: '新词单', words: [{ en: 'dog' }], wrong: {}, history: [], created: 99 }], settings: {} }));
      f.contentWindow.KMData._flush();
      ok(store[K] && JSON.parse(store[K].v).value.lists[0].id === 'L9', '听写页写入后同步到共享存储');
      // 2. 「我的数据」页导出：从共享存储读听写
      const exp = f.contentWindow.KMData.collect();
      ok(exp.keys[K] && exp.keys[K].lists[0].id === 'L9' && exp.meta[K] && exp.meta[K].L9, '验收 14：导出的文件里能看到听写页新建的词单（含修改记录）');
      // 3. 导入后写回共享存储；听写页下次打开时合并进本地
      f.contentWindow.KMData.apply({ keys: { [K]: { lists: [{ id: 'L9', name: '新词单', words: [{ en: 'dog' }], wrong: {}, history: [], created: 99 }, { id: 'L5', name: '导入的', words: [], wrong: {}, history: [], created: 50 }], settings: {} } }, meta: { [K]: { L5: { t: 5 } } } });
      ok(JSON.parse(store[K].v).value.lists.length === 2, '导入写回共享存储');
      f.remove();
      f = await frame();      // 重新打开听写页
      eq(JSON.parse(localStorage.getItem(K)).lists.map(l => l.id), ['L9', 'L5'], '听写页打开时把共享存储里的词单合并进本地');
      f.remove();
    });
  } finally {
    D._resetDevice();       // 测试里换过设备编号：清掉缓存，还原后用回原来的编号
    localStorage.clear();
    Object.keys(saved).forEach(k => localStorage.setItem(k, saved[k]));
    D._flush();
    localStorage.clear();
    Object.keys(saved).forEach(k => Storage.prototype.setItem.call(localStorage, k, saved[k]));
    D._flush();
  }
  document.getElementById('sum').innerHTML = res.fail ? `<span class="bad">${res.fail} 项失败</span>，${res.pass} 项通过` : `<span class="ok">全部 ${res.pass} 项通过</span>`;
  res.done = true;
})();
</script>
