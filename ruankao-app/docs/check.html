<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>内容自检</title>
<style>body{font:14px/1.6 system-ui,sans-serif;margin:20px;max-width:900px}li.err{color:#b91c1c}li.warn{color:#b45309}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:2px 8px}</style>
</head>
<body>
<h1>内容自检</h1>
<p>用法：启动 launch 配置 ruankao（根目录是 ruankao-app），打开 <code>/docs/check.html</code>；App 页面在 <code>/www/</code>。</p>
<div id="out"></div>
<script>
// 按 index.html 的顺序加载内容文件
(async function () {
  const base = '../www/';
  const html = await (await fetch(base + 'index.html', { cache: 'no-store' })).text();
  const srcs = [...html.matchAll(/<script src="(data\/[^"]+)"/g)].map(m => m[1]);
  for (const s of srcs) {
    await new Promise(r => { const e = document.createElement('script'); e.src = base + s + '?t=' + Date.now(); e.onload = r; e.onerror = () => { probs.push(['err', '加载失败：' + s]); r(); }; document.head.appendChild(e); });
  }
  check();
  await checkExercises();
})();
// 代码练习：用 App 里同一个 Brython 运行参考答案，输出必须等于 expect；起始代码不能直接通过
async function checkExercises() {
  const AI = RK.ai || { nodes: [] };
  const list = [];
  AI.nodes.forEach(n => (n.exercises || []).forEach((x, i) => list.push([n, x, i])));
  const box = document.createElement('div');
  document.getElementById('out').appendChild(box);
  if (!list.length) { box.innerHTML = '<p>代码练习：0 道</p>'; return; }
  box.innerHTML = `<p>代码练习：${list.length} 道，正在用 Brython 运行参考答案…</p>`;
  await new Promise(r => { const e = document.createElement('script'); e.src = '../www/js/pyrun.js?t=' + Date.now(); e.onload = r; document.head.appendChild(e); });
  PyRun.base = '../www/';
  const bad = [];
  for (const [n, x, i] of list) {
    const at = `${n.id} 练习${i + 1}`;
    if (!x.q || x.starter == null || !x.answer || x.expect == null) { bad.push(at + '：缺 q / starter / answer / expect'); continue; }
    if (/\t/.test(x.answer + x.starter)) bad.push(at + '：代码里有制表符');
    if (/input\(/.test(x.answer)) bad.push(at + '：用了 input()');
    const r = await PyRun.run(x.answer);
    if (r.err || !PyRun.same(r.out, x.expect)) bad.push(at + '：参考答案在 Brython 里的输出和 expect 不同<pre>' + esc2(r.out) + '</pre>期望<pre>' + esc2(x.expect) + '</pre>');
    const r2 = await PyRun.run(x.starter);
    if (!r2.err && PyRun.same(r2.out, x.expect)) bad.push(at + '：起始代码直接就能通过');
  }
  box.innerHTML = `<p>代码练习：${list.length} 道</p>` + (bad.length ? `<h2>代码练习问题 ${bad.length}</h2><ul>${bad.map(b => `<li class="err">${b}</li>`).join('')}</ul>` : '<p>代码练习全部通过 ✓</p>');
}
function esc2(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
const probs = [];
function check() {
  const RK = window.RK, mods = new Set(RK.modules.map(m => m.id)), ids = new Set();
  const P = (lv, m) => probs.push([lv, m]);
  const AI = RK.ai || { stages: [], nodes: [], projects: [] };
  const stages = new Set(AI.stages.map(s => s.id));
  const LINKS = ['https://docs.python.org/zh-cn/3/tutorial/', 'https://git-scm.com/book/zh/v2', 'https://zh.d2l.ai/', 'https://scikit-learn.org/stable/',
    'https://pytorch.org/tutorials/', 'https://huggingface.co/learn', 'https://modelcontextprotocol.io/', 'https://docs.anthropic.com/',
    'https://platform.openai.com/docs', 'https://developers.google.com/machine-learning/crash-course',
    'https://owasp.org/www-project-top-10-for-large-language-model-applications/', 'https://www.3blue1brown.com/topics/neural-networks'];
  RK.nodes.concat(AI.nodes).forEach(n => {
    const at = n.id || '(无 id)', isAI = AI.nodes.includes(n);
    if (ids.has(n.id)) P('err', at + '：id 重复'); ids.add(n.id);
    for (const f of isAI ? ['id', 'title', 'short', 'stage', 'tip', 'learn'] : ['id', 'title', 'short', 'module', 'freq', 'tip', 'learn']) if (!n[f]) P('err', at + '：缺 ' + f);
    if (isAI) {
      if (!stages.has(n.stage)) P('err', at + '：阶段不存在 ' + n.stage);
      if (!(n.handson || []).length) P('warn', at + '：没有动手任务');
      (n.links || []).forEach(l => { if (!LINKS.includes(l.url)) P('err', at + '：链接不在白名单 ' + l.url); });
    } else if (!mods.has(n.module)) P('err', at + '：模块不存在 ' + n.module);
    if ((n.examples || []).length < 1) P('warn', at + '：没有例题');
    if ((n.tests || []).length < 4) P('warn', at + '：测试题少于 4 道');
    [...(n.examples || []).map(q => ['例', q]), ...(n.tests || []).map(q => ['测', q])].forEach(([k, q], i) => {
      const w = `${at} ${k}${i + 1}`;
      if (!q.q) P('err', w + '：缺题干');
      if (!q.explain) P('warn', w + '：缺解析');
      if (q.type === 'choice') {
        if (!Array.isArray(q.options) || q.options.length < 2) P('err', w + '：选项不对');
        else {
          if (!(q.answer >= 0 && q.answer < q.options.length)) P('err', w + '：answer 越界');
          if (new Set(q.options).size !== q.options.length) P('err', w + '：选项重复');
          if (q.options.some(o => /以上(都|均)/.test(o))) P('err', w + '：有“以上都…”选项');
        }
        if (/选\s*[A-D]\b|[A-D]\s*项|第[一二三四]项|最后一项/.test(q.explain || '')) P('err', w + '：解析里写了选项位置');
      } else if (q.type === 'fill') {
        if (!Array.isArray(q.answer) || !q.answer.length) P('err', w + '：fill 的 answer 要是数组');
      } else if (q.type === 'num') {
        if (typeof q.answer !== 'number') P('err', w + '：num 的 answer 要是数字');
      } else P('err', w + '：未知题型 ' + q.type);
    });
  });
  RK.nodes.concat(AI.nodes).forEach(n => (n.prereqs || []).forEach(p => { if (!ids.has(p)) P('err', n.id + '：前置不存在 ' + p); }));
  AI.projects.forEach(p => { if (!stages.has(p.stage)) P('err', p.id + '：阶段不存在'); });
  const want = ['ai-why', 'ai-python', 'ai-git', 'ai-http', 'ai-copilot', 'ai-workflow', 'ai-review', 'ai-ml', 'ai-metrics', 'ai-nn', 'ai-transformer', 'ai-llm',
    'ai-api', 'ai-prompt', 'ai-tools', 'ai-rag', 'ai-agent', 'ai-mcp', 'ai-multimodal', 'ai-eval', 'ai-ops', 'ai-security', 'ai-finetune', 'ai-arch', 'ai-quality', 'ai-governance',
    'py-start', 'py-control', 'py-str', 'py-list', 'py-dict', 'py-func', 'py-comp', 'py-oop', 'py-error', 'py-module', 'py-advanced', 'py-data'];
  want.forEach(id => { if (!ids.has(id)) P('warn', 'AI 路线缺节点 ' + id); });
  RK.cases.forEach(c => {
    const t = c.questions.reduce((a, q) => a + q.points.reduce((b, p) => b + p.s, 0), 0);
    if (t !== 25) P('warn', c.id + '：要点合计 ' + t + ' 分（应为 25）');
  });
  const byMod = {};
  RK.nodes.forEach(n => { const m = byMod[n.module] || (byMod[n.module] = { n: 0, t: 0 }); m.n++; m.t += (n.tests || []).length; });
  document.getElementById('out').innerHTML =
    `<p>AI 路线：${AI.stages.length} 个阶段、${AI.nodes.length} 个节点（测试题 ${AI.nodes.reduce((a, n) => a + (n.tests || []).length, 0)} 道）、${AI.projects.length} 个实战项目</p><p>知识点 ${RK.nodes.length} 个，测试题 ${RK.nodes.reduce((a, n) => a + (n.tests || []).length, 0)} 道，案例 ${RK.cases.length}，论文 ${RK.essays.length}</p>` +
    `<table><tr><th>模块</th><th>点</th><th>测试题</th></tr>${RK.modules.map(m => `<tr><td>${m.name}</td><td>${byMod[m.id] ? byMod[m.id].n : 0}</td><td>${byMod[m.id] ? byMod[m.id].t : 0}</td></tr>`).join('')}</table>` +
    (probs.length ? `<h2>问题 ${probs.length}</h2><ul>${probs.map(([l, m]) => `<li class="${l}">${m}</li>`).join('')}</ul>` : '<h2>没有发现问题 ✓</h2>');
}
</script>
</body>
</html>
