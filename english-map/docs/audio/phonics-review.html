<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼读音素试听</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
  body { padding: 16px; max-width: 900px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .ph { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); }
  .ph button { font-size: 22px; width: 100%; }
  .ph .ex { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .ph .ex a { cursor: pointer; color: var(--accent); margin-right: 6px; }
</style>
</head>
<body>
<h1>自然拼读：44 个音素试听</h1>
<p>逐个点一下听，再点例词打开拼读卡片对照。听着不对的音记下符号，告诉开发重新生成（docs/audio/build_audio.py 里的 PHONEMES / phoneme_audio）。</p>
<div class="grid" id="grid"></div>
<script src="../../audio/index.js"></script>
<script src="../../audio/ph-index.js"></script>
<script src="../../data/phonics-words.js"></script>
<script src="../../js/phonics.js"></script>
<script>
  // 每个音找三个例词（含这个音的课本/图谱词）
  const ex = {};
  Object.keys(KW_PHONICS).forEach(w => {
    KW_PHONICS[w].split('|')[1].split(' ').forEach(t => {
      const p = t.split('=')[1];
      Object.keys(KW_PH_AUDIO).forEach(u => { if (p === u && (ex[u] = ex[u] || []).length < 3 && !ex[u].includes(w)) ex[u].push(w); });
    });
  });
  const a = new Audio();
  document.getElementById('grid').innerHTML = Object.entries(KW_PH_AUDIO).map(([u, f]) =>
    `<div class="ph"><button class="btn" data-f="${f}">/${u}/</button>
     <div class="ex">${(ex[u] || []).map(w => `<a data-w="${w}">${w}</a>`).join('')}</div></div>`).join('');
  document.getElementById('grid').onclick = e => {
    const b = e.target.closest('[data-f]'); if (b) { a.src = '../../audio/ph/' + b.dataset.f + '.mp3'; a.play(); }
    const w = e.target.closest('[data-w]'); if (w) KWPhonics.open(w.dataset.w);
  };
</script>
</body>
</html>
