<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词听写</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dictation.css">
</head>
<body class="dict">
<header class="topbar">
  <button class="btn" id="btnBack">← 返回</button>
  <div class="brand">
    <h1 id="title">单词听写</h1>
    <span class="sub" id="subtitle">输入要听写的单词，随机听写、批改、记错词</span>
  </div>
</header>

<main>
  <!-- 词单列表 -->
  <section class="view" id="vList">
    <div class="row-actions">
      <button class="btn primary big" id="btnNewManual">✍️ 新建词单</button>
    </div>
    <div id="lists"></div>
    <p class="empty" id="listsEmpty">还没有词单。点「新建词单」，把要听写的单词输进去吧。</p>
  </section>

  <!-- 编辑词单 -->
  <section class="view" id="vEdit" hidden>
    <div class="card">
      <label class="field">词单名称<input id="listName" placeholder="比如：七上 Unit 3" maxlength="40"></label>
      <p class="hint">每行一个单词或短语；中文释义可以不填。去掉勾选或点 ✕ 删除不要的词。</p>
    </div>
    <div class="card">
      <div class="word-head"><span id="wordCount">0 个词</span>
        <button class="btn small" id="btnCheckAll">全选</button>
        <button class="btn small" id="btnCheckNone">全不选</button>
      </div>
      <div id="wordRows"></div>
      <button class="btn add-row" id="btnAddRow">＋ 添加一个词</button>
    </div>
    <div class="row-actions sticky">
      <button class="btn" id="btnEditCancel">取消</button>
      <button class="btn primary big" id="btnEditSave">保存词单</button>
    </div>
  </section>

  <!-- 听写设置 / 听写中 / 批改 / 结果：由 js/dict-run.js 生成（和单元单词页共用） -->
  <div id="dictRun"></div>
</main>

<script src="audio/index.js"></script>
<script src="audio/syl-index.js"></script>
<script src="data/phonics-words.js"></script>
<script src="js/phonics.js"></script>
<script src="js/dict-run.js"></script>
<script>DictRun.mount(document.getElementById('dictRun'));</script>
<script src="js/dictation.js"></script>
</body>
</html>
