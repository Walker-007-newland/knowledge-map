<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中考英语知识图谱</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>中考英语知识图谱</h1>
    <span class="sub">福建 · 小学四年级到初三</span>
  </div>
  <div class="progress-wrap" title="已掌握的知识点">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="progressText">0 / 0</span>
  </div>
  <div class="actions">
    <button class="btn primary" id="btnDiag">入门诊断</button>
    <button class="btn" id="btnPath">学习路线</button>
    <button class="btn" id="btnNext">下一步学什么</button>
    <button class="btn" id="btnBackup">备份进度</button>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="搜索知识点…" autocomplete="off">
  <div class="chips" id="moduleChips"></div>
  <div class="legend">
    <span><i class="dot st-new"></i>未学</span>
    <span><i class="dot st-learning"></i>学习中</span>
    <span><i class="dot st-weak"></i>需加强</span>
    <span><i class="dot st-mastered"></i>已掌握</span>
    <span class="star">★ 考频</span>
  </div>
  <div class="zoom">
    <button class="btn icon" id="zoomOut" aria-label="缩小">−</button>
    <button class="btn icon" id="zoomFit" aria-label="适应窗口">⤢</button>
    <button class="btn icon" id="zoomIn" aria-label="放大">+</button>
  </div>
</div>

<main id="main">
  <div class="graph-wrap" id="graphWrap"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
</main>

<div class="overlay" id="overlay" hidden><div class="ov-card" id="ovCard" role="dialog" aria-modal="true"></div></div>
<div class="popover" id="popNext" hidden></div>
<div class="popover" id="popBackup" hidden>
  <h3>备份进度</h3>
  <p>进度只保存在这台设备的浏览器里。换设备（比如从电脑换到平板）时，先在原设备导出，再到新设备导入。</p>
  <div class="row">
    <button class="btn primary" id="btnExport">导出进度文件</button>
    <label class="btn">导入进度文件<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
  </div>
  <p class="muted" id="backupMsg"></p>
</div>

<script src="data/modules.js"></script>
<script src="data/grammar.js"></script>
<script src="data/grammar-g4-6.js"></script>
<script src="data/grammar-g7.js"></script>
<script src="data/grammar-g8a.js"></script>
<script src="data/grammar-g8b-9.js"></script>
<script src="data/phonics.js"></script>
<script src="data/vocab-a.js"></script>
<script src="data/vocab-b.js"></script>
<script src="data/talk.js"></script>
<script src="data/skill-a.js"></script>
<script src="data/skill-b.js"></script>
<script src="data/skill-c.js"></script>
<script src="data/skill-d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
