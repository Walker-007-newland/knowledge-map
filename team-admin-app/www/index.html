<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>团队审批</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1f23; --muted: #6b6f76; --line: #e4e1da;
    --accent: #1f7a4d; --accent-ink: #ffffff; --warn: #b26b00; --bad: #b3261e; --chip: #efece6;
    --code: #f1efea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181b; --card: #222428; --ink: #e9e7e3; --muted: #9a9ea6; --line: #33363b;
      --accent: #4cc38a; --accent-ink: #0d1f16; --warn: #f0b24a; --bad: #ff8a80; --chip: #2c2f34; --code: #2a2c31; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; max-width: 900px; margin: 0 auto; }
  .bar h1 { font-size: 19px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; }
  .tabs { display: flex; gap: 6px; padding: 0 16px 10px; max-width: 900px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px;
    background: var(--bad); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 16px 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .item { cursor: pointer; }
  .item .t { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
  .chip.s-待审批, .chip.s-阻塞 { background: var(--warn); color: #fff; }
  .chip.s-已上线, .chip.s-已批准 { background: var(--accent); color: var(--accent-ink); }
  .chip.s-已驳回, .chip.s-产品否决, .chip.s-返工 { background: var(--bad); color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .role { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .role b { color: var(--ink); }
  .card.proposal { border: 2px solid var(--accent); }
  .md h2 { font-size: 18px; margin: 8px 0; } .md h3 { font-size: 16px; margin: 10px 0 4px; } .md h4 { font-size: 15px; margin: 8px 0 4px; }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
  .md code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 14px; word-break: break-all; }
  .md pre { background: var(--code); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; margin: 6px 0; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md a { color: var(--accent); }
  .md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); z-index: 6; }
  .actions .in { max-width: 900px; margin: 0 auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .actions textarea, .form textarea, .form input { width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .actions textarea { height: 64px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .row button { flex: 1; min-width: 96px; }
  .form label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .form textarea { min-height: 160px; }
  .office { padding: 8px; }
  .room { position: relative; width: 100%; aspect-ratio: 224 / 136; border-radius: 8px; overflow: hidden; }
  .room canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .tag { position: absolute; transform: translate(-50%, 0); font-size: 11px; line-height: 1; padding: 2px 4px; border-radius: 4px;
    background: rgba(0,0,0,.55); color: #fff; white-space: nowrap; pointer-events: none; }
  .bub { position: absolute; transform: translateY(-100%); font-size: 10px; line-height: 1.3; padding: 2px 6px; border-radius: 6px;
    background: #fff; color: #1d1f23; border: 1px solid #1d1f23; white-space: nowrap; pointer-events: none; box-shadow: 1px 1px 0 #1d1f23; }
  .bub.bad { background: #ffe1de; border-color: #b3261e; color: #b3261e; }
  .board { width: 100%; margin-top: 8px; text-align: left; }
  .board.hot { border-color: var(--warn); color: var(--warn); font-weight: 600; }
  .mcard { display: flex; gap: 12px; align-items: flex-start; }
  .ava { width: 30px; height: 51px; image-rendering: pixelated; flex: none; margin-top: 2px; }
  .mtext { margin-top: 2px; }
  .chip.ms-working { background: var(--accent); color: var(--accent-ink); }
  .chip.ms-blocked { background: var(--bad); color: #fff; }
  .chip.ms-stale { background: var(--warn); color: #fff; }
  .feed { font-size: 14px; padding: 3px 0; border-top: 1px dashed var(--line); }
  .feed:first-child { border-top: 0; }
  .toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 8px 16px; border-radius: 10px; z-index: 20; font-size: 14px; max-width: 90vw; }
  .hint { color: var(--muted); font-size: 14px; }
  .hint ol { padding-left: 20px; }
  /* 节点页（node.js） */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-left: 5px; vertical-align: middle; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .seg button { padding: 5px 12px; border-radius: 8px; font-size: 14px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin-top: 8px; font-size: 15px; }
  .kv span { color: var(--muted); } .kv b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .nok { color: var(--accent); } .nbad { color: var(--bad); } .nwarn { color: var(--warn); }
  .chip.nok { background: var(--accent); color: var(--accent-ink); } .chip.nbad { background: var(--bad); color: #fff; } .chip.nwarn { background: var(--warn); color: #fff; }
  .ngray { opacity: .55; }
  .nsec { background: color-mix(in srgb, var(--bad) 8%, transparent); }
  label.btn { display: inline-flex; align-items: center; justify-content: center; flex: 1; min-width: 96px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 400; margin: 0; }
  label.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .ncode-msg { margin-top: 8px; font-size: 14px; }
  .nform2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 12px; }
  .form select { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .ncheck { display: flex !important; gap: 8px; align-items: flex-start; font-weight: 400 !important; margin: 4px 0 8px !important; }
  .ncheck input { width: auto !important; margin-top: 5px; }
  .nmodal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .nmodal-in { background: var(--card); border-radius: 14px; padding: 16px; width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; text-align: center; }
  .nmodal-in canvas { width: 100%; max-width: 420px; height: auto; image-rendering: pixelated; margin: 10px auto; display: block; border-radius: 6px; }
  .nmodal-in textarea { width: 100%; font: 13px/1.4 monospace; color: var(--ink); background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 6px; height: 64px; resize: none; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button id="back" hidden aria-label="返回">‹ 返回</button>
    <h1 id="title">团队审批</h1>
    <button id="newReq" title="提一个需求">＋ 需求</button>
    <button id="refresh" title="刷新">刷新</button>
    <button id="settings" title="设置与更新" aria-label="设置">⚙</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="actions" id="actions" hidden><div class="in" id="actionsIn"></div></div>

<script src="node.js"></script>
<script>
// ---------- 网络：App 里走原生桥；浏览器里 ?mock 用假数据预览界面 ----------
const MOCK = !window.Native && /[?&]mock/.test(location.search);
const REPO = window.Native ? Native.repo() : 'Walker-007-newland/knowledge-map-team';
const P = '状态:';
let seq = 0; const waiting = {};
window.__ghDone = (id, status, text) => { const w = waiting[id]; delete waiting[id]; if (w) w(status, text); };
function gh(method, path, body) {
  if (MOCK) return mockApi(method, path, body);
  return new Promise((resolve, reject) => {
    const id = 'r' + (++seq);
    waiting[id] = (status, text) => {
      let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (status >= 200 && status < 300) resolve(data);
      else reject(new Error(status === 0 ? '网络连不上：' + text : `GitHub ${status}：${(data && data.message) || text}`));
    };
    Native.request(id, method, path, body ? JSON.stringify(body) : '');
  });
}
const hasToken = () => MOCK || (window.Native && Native.hasToken());

// ---------- 状态 ----------
const TABS = [
  { key: 'office', name: '办公室', office: true },
  { key: 'node', name: '节点', node: true },
  { key: 'approve', name: '待审批', states: ['待审批', '阻塞'] },
  { key: 'doing', name: '进行中', states: ['已批准', '开发中', '待测试', '返工', '需修改'] },
  { key: 'review', name: '待评审', states: ['待评审'] },
  { key: 'done', name: '已结束', closed: true },
];
let tab = 'office', issues = [], closed = [], current = null, team = { members: {}, log: [] };
const STATUS_LABEL = '团队状态';
const isStatus = i => i.labels.some(l => l.name === STATUS_LABEL);
const stateOf = i => (i.labels.map(l => l.name).find(n => n.startsWith(P)) || '').slice(P.length);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const $ = id => document.getElementById(id);

function toast(msg, ms = 2200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

// ---------- 极简 Markdown ----------
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
}
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n'); let out = '', i = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (/^```/.test(l)) { let code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; out += `<pre><code>${esc(code.join('\n'))}</code></pre>`; continue; }
    let h = l.match(/^(#{1,4})\s+(.*)/); if (h) { const n = Math.min(4, h[1].length + 1); out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      out += '<table><tr>' + cells(l).map(c => `<th>${c}</th>`).join('') + '</tr>'; i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) out += '<tr>' + cells(lines[i++]).map(c => `<td>${c}</td>`).join('') + '</tr>';
      out += '</table>'; continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ol = /^\s*\d+\./.test(l); out += ol ? '<ol>' : '<ul>';
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let t = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, '').replace(/^\[ \]\s*/, '☐ ').replace(/^\[x\]\s*/i, '☑ ');
        out += `<li>${inline(t)}</li>`;
      }
      out += ol ? '</ol>' : '</ul>'; continue;
    }
    if (/^>\s?/.test(l)) { let q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, '')); out += `<blockquote>${inline(q.join(' '))}</blockquote>`; continue; }
    if (!l.trim()) { i++; continue; }
    let para = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#|```|\s*([-*]|\d+\.)\s|>|\s*\|)/.test(lines[i])) para.push(lines[i++]);
    out += `<p>${para.map(inline).join('<br>')}</p>`;
  }
  return out;
}

// ---------- 列表 ----------
function renderTabs() {
  $('tabs').innerHTML = TABS.map(t => {
    const n = t.closed || t.office || t.node ? 0 : issues.filter(i => t.states.includes(stateOf(i))).length;
    const badge = t.node ? (window.nodeAlert ? '<span class="dot" title="节点需要注意"></span>' : '')
      : t.key === 'approve' && n ? `<span class="badge">${n}</span>` : (n && !t.closed ? ` ${n}` : '');
    return `<button data-k="${t.key}" class="${t.key === tab ? 'on' : ''}">${t.name}${badge}</button>`;
  }).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.k; renderList(); });
}
function renderList() {
  current = null; $('back').hidden = true; $('title').textContent = '团队审批';
  $('tabs').hidden = false; $('actions').hidden = true; $('newReq').hidden = false;
  renderTabs();
  const t = TABS.find(x => x.key === tab);
  if (t.office) return renderOffice();
  stopOffice();
  if (t.node) return renderNode();
  const list = t.closed ? closed : issues.filter(i => t.states.includes(stateOf(i)));
  $('main').innerHTML = list.length ? list.map(i => `
    <div class="card item" data-n="${i.number}">
      <div class="t">#${i.number} ${esc(i.title)}</div>
      <div class="meta"><span class="chip s-${stateOf(i)}">${stateOf(i) || '无状态'}</span><span>更新于 ${when(i.updated_at)}</span>${i.comments ? `<span>${i.comments} 条记录</span>` : ''}</div>
    </div>`).join('') : `<div class="empty">${t.key === 'approve' ? '没有等你处理的方案 🎉' : '暂无'}</div>`;
  $('main').querySelectorAll('.item').forEach(el => el.onclick = () => openIssue(+el.dataset.n));
  window.scrollTo(0, 0);
}
async function load(quiet) {
  if (!hasToken()) return renderSetup();
  if (!quiet) $('main').innerHTML = '<div class="empty">加载中…</div>';
  try {
    const [open, done] = await Promise.all([
      gh('GET', `/repos/${REPO}/issues?state=open&per_page=100&sort=updated`),
      gh('GET', `/repos/${REPO}/issues?state=closed&per_page=30&sort=updated`),
    ]);
    const st = open.find(isStatus);
    team = st ? parseTeam(st.body) : { members: {}, log: [] };
    issues = open.filter(i => !i.pull_request && !isStatus(i)); closed = done.filter(i => !i.pull_request && !isStatus(i));
    if (quiet && tab === 'office' && !current) return updateOffice();
    if (current) openIssue(current.number, true); else renderList();
  } catch (e) {
    if (quiet) return;
    $('main').innerHTML = `<div class="card">加载失败：${esc(e.message)}<div class="row"><button id="retok">重新设置 token</button></div></div>`;
    $('retok').onclick = renderSetup;
  }
}

// ---------- 办公室（像素风，看每个成员在做什么） ----------
const W = 224, H = 176;
// desk：工位桌子左上角；seat：空闲时去休息区沙发的位置；fixed：不去休息区（CEO 空闲时在办公室喝茶）
const MEMBERS = [
  { role: '需求员', name: '小需', hair: '#6b3e1f', shirt: '#e8833a', desk: [14, 60], seat: [100, 130], look: 'short', queue: [] },
  { role: '产品', name: '小品', hair: '#1c1c22', shirt: '#8a5cd1', desk: [80, 60], seat: [114, 130], look: 'long', queue: ['待评审', '需修改', '已驳回'] },
  { role: '开发', name: '小开', hair: '#22232a', shirt: '#2f6fde', desk: [14, 104], seat: [128, 130], look: 'phones', queue: ['已批准', '返工', '开发中'] },
  { role: '开发2', name: '小发', hair: '#3a2a1a', shirt: '#1f9bb3', desk: [80, 104], seat: [142, 130], look: 'cap', queue: [] },
  { role: '开发3', name: '小码', hair: '#141414', shirt: '#5c6bc0', desk: [146, 104], seat: [156, 130], look: 'short', queue: [] },
  { role: '测试', name: '小测', hair: '#9a3b22', shirt: '#2e9e6a', desk: [14, 148], seat: [170, 130], look: 'glasses', queue: ['待测试'] },
  { role: 'CEO', name: 'CEO', hair: '#6f6f6f', shirt: '#2b3a55', desk: [162, 66], dw: 54, fixed: true, look: 'suit', queue: ['待审批'] },
];
const MS = { working: '工作中', idle: '空闲', blocked: '阻塞', stale: '可能已中断' };
const STALE_MS = 3 * 3600e3;
let office = null;

function parseTeam(body) {
  try { return JSON.parse(String(body).split('```json')[1].split('```')[0]); } catch (e) { return { members: {}, log: [] }; }
}
function ago(t) {
  if (!t) return '';
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  return m < 1 ? '刚刚' : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`;
}
function memberState(m) {
  const s = team.members[m.role];
  if (!s) return { state: 'idle', text: '还没上报过状态' };
  if (s.state === 'working' && Date.now() - new Date(s.at) > STALE_MS) return { ...s, state: 'stale' };
  return s;
}
const atDesk = st => st === 'working' || st === 'blocked';
const seatOf = (m, st) => atDesk(st) || m.fixed ? [m.desk[0] + (m.fixed ? 14 : 8), m.desk[1] - 15] : m.seat;

function renderOffice() {
  const counts = s => issues.filter(i => s.includes(stateOf(i))).length;
  $('main').innerHTML = `
    <div class="office card">
      <div class="room" id="room" style="aspect-ratio:${W} / ${H}"><canvas id="oc" width="${W}" height="${H}"></canvas><div id="tags"></div></div>
      <button class="board" id="board" title="看待审批"></button>
    </div>
    <div id="mcards"></div>
    <div class="card"><div style="font-weight:700;margin-bottom:6px">最近动态</div><div id="feed"></div></div>`;
  $('board').onclick = () => { tab = 'approve'; renderList(); };
  const ctx = $('oc').getContext('2d');
  office = { ctx, raf: 0, frame: 0, people: MEMBERS.map(m => { const p = seatOf(m, memberState(m).state); return { m, x: p[0], y: p[1] }; }) };
  $('tags').innerHTML = MEMBERS.map((m, k) => `<div class="tag" id="tag${k}">${m.name}</div><div class="bub" id="bub${k}" hidden></div>`).join('');
  updateOffice();
  const loop = () => { if (!office) return; office.frame++; drawOffice(); office.raf = requestAnimationFrame(loop); };
  loop();
}
function stopOffice() { if (office) cancelAnimationFrame(office.raf); office = null; }

function updateOffice() {
  if (!office || !$('mcards')) return renderList();
  renderTabs();
  const counts = s => issues.filter(i => s.includes(stateOf(i))).length;
  const pending = counts(['待审批']), blocked = counts(['阻塞']);

    : '<div class="hint">还没有动态</div>';
}

// 画一个小人：8×16 像素，左上角 (x,y)
function drawPerson(g, m, x, y, o) {
  const R = (c, a, b, w, h) => { g.fillStyle = c; g.fillRect(x + a, y + b, w, h); };
  const skin = '#f2c9a0', pants = '#3b4252', f = o.frame;
  const blink = (f + m.desk[0] * 7) % 220 < 6;
  if (!o.seated) {               // 腿（坐着时被桌子/沙发挡住）
    const step = o.walking ? (Math.floor(f / 8) % 2) : 0;
    R(pants, 1, 12, 2, 3 - step); R(pants, 5, 12, 2, 3 - (1 - step) * (o.walking ? 1 : 0));
    R('#222', 1, 15 - step, 2, 1); R('#222', 5, 15 - (o.walking ? 1 - step : 0), 2, 1);
  } else { R(pants, 1, 12, 6, 2); }
  R(m.shirt, 1, 7, 6, 5);                          // 身体
  const type = o.typing ? Math.floor(f / 6) % 2 : 0;
  R(m.shirt, 0, 8, 1, 3); R(m.shirt, 7, 8, 1, 3);  // 手臂
  R(skin, 0, 11 - type, 1, 1); R(skin, 7, 10 + type, 1, 1);
  R(skin, 1, 2, 6, 5);                             // 脸
  R(m.hair, 1, 0, 6, 2); R(m.hair, 1, 2, 1, 1); R(m.hair, 6, 2, 1, 1);
  if (m.look === 'long') { R(m.hair, 0, 1, 1, 7); R(m.hair, 7, 1, 1, 7); }
  if (m.look === 'short') R(m.hair, 2, 2, 3, 1);
  if (!blink) { R('#222', 2, 4, 1, 1); R('#222', 5, 4, 1, 1); } else { R('#c49a78', 2, 4, 1, 1); R('#c49a78', 5, 4, 1, 1); }
  if (m.look === 'glasses') { R('#333', 1, 4, 3, 1); R('#333', 4, 4, 3, 1); R('#9fd3f5', 2, 4, 1, 1); R('#9fd3f5', 5, 4, 1, 1); }
  if (m.look === 'phones') { R('#e04848', 0, 3, 1, 3); R('#e04848', 7, 3, 1, 3); R('#555', 1, -1, 6, 1); }
  if (m.look === 'cap') { R('#e67e22', 1, -1, 6, 2); R('#e67e22', 6, 1, 3, 1); }
  if (m.look === 'suit') { R('#fff', 3, 7, 2, 1); R('#c0392b', 3, 8, 2, 3); }
  R('#d9776b', 3, 6, 2, 1);                        // 嘴
  if (o.cup) { R('#fff', 8, 9, 2, 3); R('#7a4a2a', 8, 9, 2, 1); }
}

function drawOffice() {
  const o = office, g = o.ctx, f = o.frame;
  const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  // 墙和地板
  R('#eadfc8', 0, 0, W, 36); R('#d8c9aa', 0, 33, W, 3); R('#a8875e', 0, 36, W, 2);
  for (let y = 38; y < H; y += 7) { R(y % 14 < 7 ? '#d7bf96' : '#d1b88e', 0, y, W, 7); for (let x = (y * 3) % 40; x < W; x += 40) R('#bfa47a', x, y, 1, 7); }
  // 窗户：天色跟着真实时间变
  const hr = new Date().getHours(), night = hr < 6 || hr >= 19;
  R('#fff', 10, 5, 44, 24); R(night ? '#1d2b53' : (hr < 8 || hr >= 17) ? '#f6b26b' : '#9fd3f5', 12, 7, 40, 20);
  if (night) { [[16, 10], [30, 13], [44, 9], [38, 20]].forEach(([a, b]) => R('#fff', a, b, 1, 1)); R('#f5f0c8', 44, 11, 4, 4); }
  else { const cx = 12 + ((f / 20) % 50) - 6; R('#fff', cx, 12, 8, 3); R('#fff', cx + 2, 10, 4, 2); }
  R('#fff', 31, 7, 2, 20); R('#fff', 12, 16, 40, 2);
  // 看板：便利贴数量 = 各状态需求单数
  R('#8d8d8d', 62, 4, 66, 26); R('#fbfbfb', 63, 5, 64, 24);

  cols.forEach(([st, c], k) => {
    const n = Math.min(4, issues.filter(i => stateOf(i) === st || (st === '开发中' && stateOf(i) === '返工')).length);
    R('#e3e3e3', 66 + k * 10, 8, 8, 1);
    for (let j = 0; j < n; j++) R(c, 66 + k * 10, 11 + j * 4, 7, 3);
  });
  // 时钟
  const now = new Date(), cx = 140, cy = 15;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, 7, 0, 7); g.fill(); g.strokeStyle = '#555'; g.lineWidth = 1; g.stroke();
  const hand = (a, l, c) => { g.strokeStyle = c; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(a) * l, cy - Math.cos(a) * l); g.stroke(); };
  hand((now.getHours() % 12 + now.getMinutes() / 60) / 12 * 6.283, 4, '#333'); hand(now.getMinutes() / 60 * 6.283, 6, '#777');
  // CEO 室：墙上金色门牌、植物，玻璃隔断（下方留门）
  R('#9c7a12', 170, 12, 34, 13); R('#d4a72c', 171, 13, 32, 11);
  g.fillStyle = '#4a3500'; g.font = 'bold 8px monospace'; g.fillText('CEO', 175, 22);
  R('#8b5a2b', 212, 28, 8, 8); R('#3f9b4f', 211, 18, 4, 10); R('#4fb35f', 215, 14, 4, 14); R('#3f9b4f', 218, 20, 3, 8);
  R('#cfe3ef', 151, 38, 73, 50); R('#c4d8e6', 153, 40, 69, 46);   // 室内地毯
  // 休息区：地毯 + 沙发靠背 + 咖啡机
  R('#c98b7a', 86, 128, 136, 46); R('#d9a090', 88, 130, 132, 42);
  R('#5a8f7b', 94, 132, 92, 10);
  R('#555', 202, 140, 14, 26); R('#333', 204, 143, 10, 6); R(f % 60 < 30 ? '#4cc38a' : '#2a7a55', 212, 152, 2, 2); R('#fff', 206, 156, 4, 4);
  // 人：先移动，再按 y 排序画
  o.people.forEach(p => {
    const st = memberState(p.m).state, [tx, ty] = seatOf(p.m, st);
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    p.walking = d > 0.6;
    if (p.walking) { p.x += dx / d * 0.6; p.y += dy / d * 0.6; } else { p.x = tx; p.y = ty; }
    p.st = st;
  });
  // 桌子、显示器（画在人前面，挡住腿）
  const drawDesk = (p) => {
    const [x, y] = p.m.desk, on = atDesk(p.st) && !p.walking, dw = p.m.dw || 46, mx = x + dw - 20;
    R(p.m.ceo || p.m.fixed ? '#3d2b1f' : '#5b5b66', x + (p.m.fixed ? 10 : 4), y - 18, 16, 2);  // 椅背（CEO 是皮椅）
    return () => {
      R(p.m.fixed ? '#7a4a24' : '#a5713f', x, y, dw, 4); R(p.m.fixed ? '#5e3818' : '#8a5a30', x, y + 4, dw, 2); R('#6d4524', x + 2, y + 6, 2, 8); R('#6d4524', x + dw - 4, y + 6, 2, 8);
      R('#333', mx, y - 12, 16, 11); R('#555', mx + 6, y - 1, 4, 1);
      const scr = !on ? '#20242b' : p.st === 'blocked' ? (f % 40 < 20 ? '#b3261e' : '#7a1a14') : '#1f3b5c';
      R(scr, mx + 1, y - 11, 14, 9);
      if (on && p.st === 'working') for (let k = 0; k < 4; k++) { const w = 3 + ((k * 5 + Math.floor(f / 10)) % 8); R(k % 2 ? '#7ee0a1' : '#9fd3f5', mx + 2, y - 10 + k * 2, w, 1); }
      R('#ddd', x + (p.m.fixed ? 18 : 12), y + 1, 10, 2);   // 键盘
      if (p.m.fixed) {   // CEO：待审批文件堆（一份一张，最多 6 张），工作时盖章
        for (let k = 0; k < Math.min(6, pending); k++) R(k % 2 ? '#fffdf5' : '#f0e6d0', x + 3, y - 2 - k, 9, 1);
        if (on && p.st === 'working') { const up = f % 30 < 15; R('#5e3818', x + 5, y - 9 - (up ? 3 : 0), 2, 4); R('#c0392b', x + 4, y - 5 - (up ? 3 : 0), 4, 2); if (!up) R('#e57373', x + 13, y - 1, 3, 1); }
      } else R('#f0e6d0', x + 2, y - 2, 6, 2);  // 文件
    };
  };
  const pending = issues.filter(i => stateOf(i) === '待审批').length;
  const fronts = o.people.map(drawDesk);
  o.people.slice().sort((a, b) => a.y - b.y).forEach(p => {
    const seated = !p.walking, desk = atDesk(p.st);
    drawPerson(g, p.m, Math.round(p.x), Math.round(p.y), { frame: f, walking: p.walking, seated, typing: seated && desk && p.st === 'working' && !p.m.fixed, cup: seated && !desk });
  });
  fronts.forEach(fn => fn());
  g.fillStyle = 'rgba(150,200,230,.55)'; g.fillRect(150, 38, 2, 50); g.fillRect(150, 87, 30, 2); g.fillRect(198, 87, 26, 2);
  // 沙发坐垫（挡住坐着的人的腿）+ 扶手 + 茶几
  R('#6fa894', 92, 144, 96, 8); R('#4b7a68', 90, 134, 4, 18); R('#4b7a68', 186, 134, 4, 18);
  R('#8a5a30', 116, 158, 48, 4); R('#6d4524', 118, 162, 2, 5); R('#6d4524', 160, 162, 2, 5);
  // 头顶特效
  o.people.forEach((p, k) => {
    const x = Math.round(p.x), y = Math.round(p.y);
    if (p.st === 'blocked' && f % 50 < 35) { R('#e53935', x + 3, y - 9, 2, 4); R('#e53935', x + 3, y - 4, 2, 1); }
    if ((p.st === 'idle' || p.st === 'stale') && !p.walking) {
      const s = team.members[p.m.role], long = !s || Date.now() - new Date(s.at) > 90 * 60e3;
      if (long) { const t = (f + k * 40) % 120; g.fillStyle = 'rgba(80,80,120,' + (1 - t / 120) + ')'; g.font = '6px monospace'; g.fillText('z', x + 8 + t / 30, y - 2 - t / 12); }
    }
    // HTML 名牌和气泡跟着人走
    const tag = $('tag' + k); if (!tag) return;
    tag.style.left = ((x + 4) / W * 100) + '%'; tag.style.top = ((y + 17) / H * 100) + '%';
    const bub = $('bub' + k), s = memberState(p.m);
    bub.style.top = ((y - 3) / H * 100) + '%';
    let txt = (p.st === 'working' || p.st === 'blocked') && !p.walking ? (s.issue ? `#${s.issue} ` : '') + String(s.text || '').replace(/#\d+[：:\s]*/g, '').slice(0, 5) : '';
    if (p.m.fixed && !txt && pending) txt = `待审 ${pending} 份`;
    if (bub.textContent !== txt) bub.textContent = txt;
    bub.hidden = !txt; bub.className = 'bub' + (p.st === 'blocked' ? ' bad' : '');
    if (txt) {   // 气泡别超出房间
      const rw = $('room').clientWidth, bw = bub.offsetWidth, c = (x + 4) / W * rw;
      bub.style.left = Math.max(2, Math.min(rw - bw - 2, c - bw / 2)) + 'px';
    }
  });
}

// ---------- 详情 ----------
const ROLE = [
  [/^##\s*管理员/, '管理员'], [/^##\s*产品方案/, '产品'], [/^##\s*(开发说明|修复说明)/, '开发'],
  [/^##\s*(测试报告|已上线)/, '测试'],
];
const roleOf = body => (ROLE.find(([re]) => re.test((body || '').trim())) || [0, '团队'])[1];

async function openIssue(n, keepScroll) {
  const all = issues.concat(closed); const i = all.find(x => x.number === n);
  if (!i) return renderList();
  stopOffice(); current = i; $('back').hidden = false; $('tabs').hidden = true; $('newReq').hidden = true;
  $('title').textContent = `#${n}`;
  if (!keepScroll) $('main').innerHTML = '<div class="empty">加载中…</div>';
  let comments = [];
  try { comments = await gh('GET', `/repos/${REPO}/issues/${n}/comments?per_page=100`); }
  catch (e) { toast(e.message); }
  if (current !== i) return;
  const st = stateOf(i);
  const lastProposal = [...comments].reverse().find(c => roleOf(c.body) === '产品');
  $('main').innerHTML = `
    <div class="card"><div style="font-size:18px;font-weight:700">${esc(i.title)}</div>
      <div class="meta"><span class="chip s-${st}">${st}</span><span>提出于 ${when(i.created_at)}</span>${i.state === 'closed' ? '<span>已关闭</span>' : ''}</div></div>
    <div class="card"><div class="role"><span><b>需求员</b> · 需求</span><span>${when(i.created_at)}</span></div><div class="md">${md(i.body)}</div></div>
    ${comments.map(c => `<div class="card ${c === lastProposal && st === '待审批' ? 'proposal' : ''}">
      <div class="role"><span><b>${roleOf(c.body)}</b>${c === lastProposal ? ' · 最新方案' : ''}</span><span>${when(c.created_at)}</span></div>
      <div class="md">${md(c.body)}</div></div>`).join('')}`;
  if (!keepScroll) {
    const p = $('main').querySelector('.proposal');
    if (p) p.scrollIntoView(); else window.scrollTo(0, 0);
  }
  renderActions(i, st);
}

function renderActions(i, st) {
  const box = $('actionsIn'); $('actions').hidden = i.state === 'closed';
  if (i.state === 'closed') return;
  let btns;
  if (st === '待审批') btns = `<button class="primary" data-a="approve">批准</button><button data-a="revise">要求修改</button><button class="danger" data-a="reject">驳回</button>`;
  else if (st === '阻塞') btns = `<button class="primary" data-a="toDev">交回开发</button><button data-a="toTest">交回测试</button><button data-a="revise">让产品改方案</button><button class="danger" data-a="reject">驳回</button>`;
  else btns = `<button data-a="comment">只发评论</button><button class="danger" data-a="reject">驳回 / 不做了</button>`;
  box.innerHTML = `<textarea id="note" placeholder="意见（批准可不填；要求修改、驳回、交回时请写原因）"></textarea><div class="row">${btns}</div>`;
  box.querySelectorAll('button').forEach(b => b.onclick = () => act(i, b.dataset.a, b));
  document.body.style.paddingBottom = '0';
}

const ACTS = {
  approve: { to: '已批准', head: '## 管理员审批：批准', need: false, ok: '已批准，开发会在下一轮接手' },
  revise: { to: '需修改', head: '## 管理员审批：要求修改', need: true, ok: '已退回产品修改' },
  reject: { to: '已驳回', head: '## 管理员审批：驳回', need: true, ok: '已驳回' },
  toDev: { to: '已批准', head: '## 管理员处理阻塞：交回开发', need: true, ok: '已交回开发' },
  toTest: { to: '待测试', head: '## 管理员处理阻塞：交回测试', need: true, ok: '已交回测试' },
  comment: { to: null, head: '## 管理员评论', need: true, ok: '评论已发送' },
};
async function act(i, a, btn) {
  const cfg = ACTS[a]; const note = $('note').value.trim();
  if (cfg.need && !note) { toast('请先在上面写下意见'); $('note').focus(); return; }
  const label = { approve: '批准', revise: '要求修改', reject: '驳回', toDev: '交回开发', toTest: '交回测试', comment: '发送评论' }[a];
  if (!confirm(`确定${label} #${i.number}？`)) return;
  document.querySelectorAll('#actionsIn button').forEach(b => b.disabled = true);
  try {
    await gh('POST', `/repos/${REPO}/issues/${i.number}/comments`, { body: `${cfg.head}\n\n${note || '同意按此方案执行。'}` });
    if (cfg.to) {
      for (const l of i.labels) if (l.name.startsWith(P) && l.name !== P + cfg.to)
        await gh('DELETE', `/repos/${REPO}/issues/${i.number}/labels/${encodeURIComponent(l.name)}`);
      await gh('POST', `/repos/${REPO}/issues/${i.number}/labels`, { labels: [P + cfg.to] });
    }
    toast(cfg.ok); current = null; await load();
  } catch (e) {
    toast('失败：' + e.message, 4000);
    document.querySelectorAll('#actionsIn button').forEach(b => b.disabled = false);
  }
}

window.goBack = () => { if (current) { current = null; renderList(); return true; } return false; };

setInterval(() => { if (tab === 'office' && !current && hasToken() && !document.hidden) load(true); }, 30000);
$('back').onclick = () => (current && current.number === -2 && hasToken()) ? (current = null, load()) : window.goBack();
